<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Network Journey</title>
<style>
  :root{--paper:#f2efe7;--card:#fbf9f3;--ink:#231e16;--muted:#7a7263;--rule:#ddd6c8;
    --l7:#ef6a4c;--l6:#f5a04a;--l5:#f2c94c;--l4:#8fd0a6;--l3:#6cc3cf;--l2:#7c9fe2;--l1:#b39ad8;--wire:#9aa3ad}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  code,.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
  .app{display:grid;grid-template-columns:minmax(0,1fr) 410px;grid-template-rows:auto minmax(0,1fr) auto;height:100vh;height:100dvh}
  header{grid-column:1/3;display:flex;align-items:baseline;gap:14px;padding:12px 20px 4px}
  header h1{font:800 15px ui-monospace,Menlo,monospace;margin:0;letter-spacing:.03em}
  header span{color:var(--muted);font-size:13px}
  #stage{position:relative;min-height:0;overflow:hidden}
  #stage canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  #stage canvas.drag{cursor:grabbing}
  .chip{position:absolute;left:16px;top:10px;display:flex;align-items:center;gap:8px;font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;
    background:rgba(251,249,243,.9);border:1px solid var(--rule);border-radius:999px;padding:5px 12px;pointer-events:none}
  .chip i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink)}
  .toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-6px);opacity:0;transition:.2s;background:#fff1bf;border:1px solid rgba(35,30,22,.3);
    border-radius:8px;padding:6px 12px;font:600 13px ui-monospace,Menlo,monospace;pointer-events:none;box-shadow:0 6px 18px rgba(35,30,22,.14)}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  #panel{min-height:0;overflow:auto;border-left:1px solid var(--rule);background:var(--card);display:flex;flex-direction:column}
  #panelBody{padding:18px 24px 8px;flex:1}
  .kicker{display:flex;align-items:center;gap:8px;font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .kicker i{width:12px;height:12px;border-radius:3px;border:1.5px solid var(--ink)}
  h2{font-size:28px;line-height:1.15;margin:6px 0 8px;letter-spacing:-.01em}
  .lead{font-size:18px;line-height:1.45;margin:0 0 14px}
  h3{font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
  h3 .n{color:var(--ink)}
  .steps{margin:0;padding-left:22px}
  .steps li{margin:0 0 6px}
  .pdu{display:flex;gap:4px;margin:4px 0 6px}
  .blk{all:unset;cursor:pointer;flex:1 1 0;min-width:0;border:1.5px solid var(--ink);border-radius:7px;padding:5px 6px;background:var(--c);text-align:center;
    box-shadow:0 2px 0 var(--ink);transition:transform .1s}
  .blk b{display:block;font:800 11.5px ui-monospace,Menlo,monospace;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .blk small{display:block;font:600 11px ui-monospace,Menlo,monospace;opacity:.8}
  .blk.enc{background:repeating-linear-gradient(135deg,var(--c) 0 6px,color-mix(in srgb,var(--c) 70%,#fff) 6px 12px)}
  .blk.on{transform:translateY(-3px);box-shadow:0 5px 0 var(--ink)}
  .blk:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .cap{font-size:13.5px;color:var(--muted);margin:8px 0 6px}
  .bytes{font:13px/1.9 ui-monospace,Menlo,monospace;background:#fff;border:1px solid var(--rule);border-radius:8px;padding:8px 10px;word-break:break-all;white-space:pre-wrap}
  .bytes span{border-radius:4px;padding:1px 2px;background:var(--t);transition:box-shadow .1s}
  .bytes span.sep{background:none;color:var(--muted)}
  .bytes em{font-style:normal;color:var(--muted)}
  .bytes .more{background:none;color:var(--muted)}
  .bytes span.hl,.fld.hl{box-shadow:0 0 0 2px var(--ink)}
  .flds{margin-top:8px;display:flex;flex-direction:column;gap:4px}
  .fld{border-radius:8px;padding:6px 8px;background:#fff;border:1px solid var(--rule)}
  .fld .fh{display:flex;align-items:center;gap:8px}
  .fld .fh i{width:12px;height:12px;border-radius:3px;background:var(--t);border:1px solid rgba(35,30,22,.35);flex:none}
  .fld .fh b{font-size:13.5px}
  .fld .fh code{margin-left:auto;font-size:12.5px;background:#f2efe7;border-radius:5px;padding:0 6px;white-space:nowrap}
  .fld p{margin:2px 0 0 20px;font-size:13px;color:var(--muted);line-height:1.4}
  .note{margin:18px 0 0;padding:10px 12px;border-left:3px solid var(--ink);background:#f4f0e4;border-radius:0 8px 8px 0;font-size:14px}
  .note b{font:700 11px ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:2px}
  .try{margin-top:22px;padding:12px 14px 14px;border:1.5px dashed var(--ink);border-radius:12px}
  .try h3{margin-top:0}
  .try p{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
  .try input{font:15px ui-monospace,Menlo,monospace;padding:6px 10px;border:1.5px solid var(--ink);border-radius:8px;background:#fff;width:100%}
  .btn{font:600 13.5px ui-monospace,Menlo,monospace;color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
  .btn:hover{background:#ece6d6}
  .btn[aria-pressed=true]{background:var(--ink);color:var(--paper)}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .hs{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:4px}
  .hs li{padding:5px 8px;border-radius:8px;background:#fff;border:1px solid var(--rule);font-size:13.5px;transition:.15s}
  .hs li code{font-weight:700}
  .hs li.on{background:#fff1bf;border-color:var(--ink)}
  .layers{display:flex;flex-direction:column;gap:3px;margin:6px 0 0}
  .layers div{display:flex;gap:10px;align-items:baseline;font-size:14px}
  .layers i{flex:none;width:22px;height:18px;border-radius:4px;border:1.5px solid var(--ink);font:800 11px/15px ui-monospace,Menlo,monospace;text-align:center;font-style:normal;background:var(--c)}
  .layers b{min-width:98px}
  .layers span{color:var(--muted)}
  .cast{font-size:14px;margin:0;padding-left:18px}
  .hint{color:var(--muted);font-size:13.5px}
  .nav{position:sticky;bottom:0;display:flex;gap:8px;justify-content:space-between;padding:12px 24px 14px;background:linear-gradient(transparent,var(--card) 30%)}
  .nav .btn{padding:9px 16px}
  .nav .next{background:var(--ink);color:var(--paper);margin-left:auto}
  .nav .next:hover{background:#3a3228}
  .nav .btn:disabled{opacity:.4;cursor:default}
  #rail{grid-column:1/3;border-top:1px solid var(--rule);background:var(--paper);padding:2px 10px 4px}
  #rail svg{display:block;width:100%;height:84px;overflow:visible}
  #rail .dot{cursor:pointer}
  #rail .dot.off{cursor:default}
  #rail text{font:700 10px ui-monospace,Menlo,monospace;pointer-events:none}
  @media (max-width:860px){
    .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 40vh minmax(0,1fr) auto}
    header{grid-column:1} header span{display:none}
    #panel{border-left:0;border-top:1px solid var(--rule)}
    #rail{grid-column:1}
    #panelBody{padding:14px 16px 8px} .nav{padding:10px 16px 12px}
    h2{font-size:24px} .lead{font-size:16.5px}
  }
</style></head>
<body>
<div class="app">
  <header><h1>THE NETWORK JOURNEY</h1><span>one web request, seven layers, from a laptop to a server</span></header>
  <div id="stage"><div class="chip" id="chip"><i></i><span></span></div><div class="toast" id="toast"></div></div>
  <aside id="panel"><div id="panelBody"></div><nav class="nav" id="nav"></nav></aside>
  <div id="rail"></div>
</div>
<script src="vendor/three.min.js"></script>
<script>
/* The Network Journey.
   One request (GET / from a laptop at 10.0.0.20 to a web server at 10.0.1.7) is followed stop by stop:
   down the laptop's seven layers, across a cable, a switch, a router and another cable, and up the server's layers.
   The page is three parts: MESSAGE (the real bytes at every layer), ROUTE + CONTENT (one plain-data entry per stop),
   and the engine (a three.js scene the camera flies through, a text panel, and a route map). */
addEventListener('error', e => { document.documentElement.dataset.errors = (document.documentElement.dataset.errors || '') + e.message + ';'; });

/* ================= MESSAGE: the real bytes ================= */
const NET = { laptop:'10.0.0.20', server:'10.0.1.7', host:'wiki.lan', sport:49152, dport:443 };
const msg = { path:'/', proto:'tcp', peek:false };
const enc = s => [...new TextEncoder().encode(s)];
const hashStr = s => { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; };
const prng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) & 255; };
const u16 = v => [v >> 8 & 255, v & 255], u32 = v => [v >>> 24 & 255, v >>> 16 & 255, v >>> 8 & 255, v & 255];
const ip4 = s => s.split('.').map(Number);
function inetSum(bytes){ let s = 0; for (let i = 0; i < bytes.length; i += 2) s += (bytes[i] << 8) + (bytes[i + 1] || 0); while (s >> 16) s = (s & 0xffff) + (s >> 16); return ~s & 0xffff; }
function model(m){
  const req = `GET ${m.path} HTTP/1.1\r\nHost: ${NET.host}\r\n\r\n`, http = enc(req), rnd = prng(hashStr(m.path + 'k'));
  const ct = Array.from({ length: http.length + 1 }, rnd), tag = Array.from({ length: 16 }, rnd);   // TLS 1.3: request + 1 content-type byte, then a 16-byte AEAD tag
  const recLen = ct.length + tag.length, tlsHdr = [0x17, 3, 3, ...u16(recLen)], record = [...tlsHdr, ...ct, ...tag];
  const pseudo = len => [...ip4(NET.laptop), ...ip4(NET.server), 0, m.proto === 'tcp' ? 6 : 17, ...u16(len)];
  let l4;
  if (m.proto === 'tcp'){
    const seq = 0x4f2a9b11, ack = 0x1d7e33a3, h0 = [...u16(NET.sport), ...u16(NET.dport), ...u32(seq), ...u32(ack), 0x50, 0x18, ...u16(64240), 0, 0, 0, 0];
    const cs = inetSum([...pseudo(20 + record.length), ...h0, ...record]);
    l4 = { name:'TCP', len:20, seq, ack, cs, bytes:[...h0.slice(0, 16), ...u16(cs), 0, 0] };
  } else {
    const len = 8 + record.length, h0 = [...u16(NET.sport), ...u16(NET.dport), ...u16(len), 0, 0], cs = inetSum([...pseudo(len), ...h0, ...record]) || 0xffff;
    l4 = { name:'UDP', len:8, cs, ulen:len, bytes:[...h0.slice(0, 6), ...u16(cs)] };
  }
  return { req, http, ct, tag, recLen, tlsHdr, record, l4, path:m.path, proto:m.proto };
}
const hex = b => b.toString(16).padStart(2, '0');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c]);

/* ================= ROUTE: every stop on the journey ================= */
const LAYER = { 7:'Application', 6:'Presentation', 5:'Session', 4:'Transport', 3:'Network', 2:'Data link', 1:'Physical' };
const LCOL = { 7:'#ef6a4c', 6:'#f5a04a', 5:'#f2c94c', 4:'#8fd0a6', 3:'#6cc3cf', 2:'#7c9fe2', 1:'#b39ad8', 0:'#9aa3ad' };
const ROUTE = [
  { id:'start', kind:'intro', short:'Start', layer:8 },
  ...[7, 6, 5, 4, 3, 2, 1].map(n => ({ id:'send-' + n, kind:'send', layer:n, short:LAYER[n] })),
  { id:'cable-1', kind:'wire', layer:0, short:'Cable' }, { id:'switch', kind:'switch', layer:0, short:'Switch' },
  { id:'router', kind:'router', layer:0, short:'Router' }, { id:'cable-2', kind:'wire', layer:0, short:'Cable' },
  ...[1, 2, 3, 4, 5, 6, 7].map(n => ({ id:'recv-' + n, kind:'recv', layer:n, short:LAYER[n] })),
];
const colorOf = st => st.kind === 'intro' ? '#231e16' : LCOL[st.layer] || LCOL[0];
const kickerOf = st => st.kind === 'intro' ? 'Start here' : st.kind === 'send' ? `Laptop · Layer ${st.layer}` : st.kind === 'recv' ? `Server · Layer ${st.layer}` : 'On the network';

/* ================= CONTENT: one entry per stop (plain data; M is the message model) ================= */
const CONTENT = {
  'start': {
    title:'The Network Journey',
    lead:'Follow one web request from a laptop to a server, one step at a time.',
    body: () => `
      <p>The laptop on the left wants a page from the server on the right. Between them sit a cable, a switch and a router. Each computer handles the request in seven layers, the <b>OSI model</b>, drawn here as seven floors.</p>
      <p>Going out, the request rides the lift <b>down</b> the laptop and every layer wraps it in a header of its own. It crosses the network as electrical signals, then rides <b>up</b> the server while each layer takes its header off again.</p>
      <h3>The seven layers</h3>
      <div class="layers">${[7, 6, 5, 4, 3, 2, 1].map(n => `<div><i style="--c:${LCOL[n]}">${n}</i><b>${LAYER[n]}</b><span>${({ 7:'what the app wants (HTTP)', 6:'encoding and encryption (TLS)', 5:'the ongoing conversation', 4:'which program, in order, nothing lost (TCP)', 3:'addresses across networks (IP)', 2:'to the next box on this wire (Ethernet)', 1:'bits as signals on a cable' })[n]}</span></div>`).join('')}</div>
      <h3>The cast</h3>
      <ul class="cast"><li>Laptop <code>${NET.laptop}</code></li><li>Switch, joining the laptop's office network</li><li>Router <code>10.0.0.1</code> | <code>10.0.1.1</code>, joining two networks</li><li>Server <code>${NET.server}</code>, called <code>${NET.host}</code></li></ul>
      <p class="hint">Press Next, use the arrow keys, or click a stop on the map at the bottom. Drag the picture to look around.</p>`,
  },
  'send-7': {
    title:'Application',
    lead:'The browser writes down what it wants, in a language called HTTP.',
    steps: M => [
      `You open <code>http://${NET.host}${esc(M.path)}</code>. The browser turns that into an HTTP request.`,
      `It is plain text: a method (<code>GET</code>), a path, a version, then headers such as <code>Host</code>.`,
      `An earlier DNS lookup already turned <code>${NET.host}</code> into the address <code>${NET.server}</code>.`,
      `The browser hands these ${M.http.length} bytes down. How they travel is not its problem.`],
    focus:'data',
    note:'Real browsers send about ten more headers (User-Agent, Accept, cookies). We keep two so every byte stays readable.',
    who:'Browsers (Chrome, Firefox, Safari), command-line tools like <code>curl</code>, and every app that talks to a server. On the far end: web servers such as nginx or Apache.',
    tryit: {
      html: M => `<input id="pathIn" value="${esc(M.path)}" maxlength="40" spellcheck="false" aria-label="Path"><p>Change the path. The request grows or shrinks, and every later layer's byte counts follow.</p>`,
      bind: () => { const el = document.getElementById('pathIn'); el.oninput = () => { let v = el.value.replace(/[^\x21-\x7e]/g, ''); if (!v.startsWith('/')) v = '/' + v; msg.path = v || '/'; refresh(); }; },
    },
    arrive: () => { typeScreen(); },
  },
  'send-6': {
    title:'Presentation',
    lead:'The request is turned into agreed bytes, then encrypted so only the server can read it.',
    steps: M => [
      `<b>Encode.</b> The text becomes bytes everyone agrees on (UTF-8): <code>G</code> is <code>0x47</code>, <code>E</code> is <code>0x45</code>, <code>T</code> is <code>0x54</code>.`,
      `<b>Encrypt.</b> TLS scrambles those bytes with a key that only the laptop and the server know (AES-GCM).`,
      `<b>Seal.</b> A 16-byte tag is added at the end, so the server can tell if anything was changed on the way.`,
      `<b>Label.</b> A 5-byte record header goes in front: what kind of data this is, and how long.`],
    focus:'tls',
    note:'The internet has no separate "layer 6 program". TLS does this job, usually inside the browser itself, so layers 5 to 7 blur together in practice.',
    who:'TLS libraries: BoringSSL in Chrome, NSS in Firefox, OpenSSL and rustls on servers.',
    tryit: {
      html: () => `<div class="seg"><button class="btn" id="peek" aria-pressed="${msg.peek}">Peek inside</button><button class="btn" id="reenc">Encrypt again</button></div><p>Peek shows what the scrambled bytes really say. Only the server can do this for real.</p>`,
      bind: () => { document.getElementById('peek').onclick = () => { msg.peek = !msg.peek; sel = 'data'; refresh(); };
        document.getElementById('reenc').onclick = () => spinRotors(); },
    },
    arrive: () => spinRotors(),
  },
  'send-5': {
    title:'Session',
    lead:'Keeps track of the conversation, so many requests can share one secure connection.',
    steps: () => [
      `Before any request, the laptop and server did a <b>TLS handshake</b>: they agreed on keys, and the server proved it really is <code>${NET.host}</code>.`,
      `That shared memory (the keys, a record counter, who the other side is) is the <b>session</b>. It lives in both computers, not in the message.`,
      `Every request in this tab reuses it. After a disconnect, a <b>session ticket</b> lets the laptop resume without starting from scratch.`],
    focus:'tls',
    unchanged:'No bytes are added here. A session is something both computers remember, not a header that travels.',
    extra: () => `<h3>What both computers remember</h3><div class="flds">${[
        ['Server identity', NET.host, 'Checked against the certificate the server sent, signed by the office certificate authority.'],
        ['Cipher', 'AES-128-GCM', 'The encryption both sides agreed on.'],
        ['Keys', '2 × 16 bytes', 'One key for each direction. They never travel; both sides computed them from the handshake.'],
        ['Record number', '0, 1, 2 …', 'Each record gets the next number, mixed into the encryption, so a replayed or reordered record is rejected.'],
        ['Resume ticket', 'valid 7 days', 'Lets a later connection skip most of the handshake.']]
      .map(([f, v, d]) => `<div class="fld"><div class="fh"><i style="--t:#e9e2cc"></i><b>${f}</b><code>${v}</code></div><p>${d}</p></div>`).join('')}</div>
      <h3>The handshake that started it</h3>
      <ol class="hs" id="hs">${HS.map(([who, m, d]) => `<li>${who} <code>${m}</code> ${d}</li>`).join('')}</ol>`,
    note:'Layer 5 is the fuzziest layer in real networks. Its job is shared by TLS and the application. Older protocols such as NetBIOS and RPC had a true session layer.',
    who:'The TLS library again, plus the browser, which keeps one connection open per site and reuses it.',
    tryit: {
      html: () => `<button class="btn" id="replay">Replay the handshake</button><p>Watch the four steps that happened just after the TCP connection opened, before our request.</p>`,
      bind: () => { document.getElementById('replay').onclick = () => playHandshake(); },
    },
    arrive: () => printTicket(),
  },
  'send-4': {
    title:'Transport',
    lead:'Labels the bytes with port numbers and sequence numbers, and promises to deliver all of them, in order.',
    steps: M => M.proto === 'tcp' ? [
      `<b>Ports pick the program.</b> Destination <code>443</code> is the server's web program. Source <code>${NET.sport}</code> is a random return address for this connection.`,
      `<b>Sequence numbers count bytes.</b> The receiver uses them to put pieces back in order and to notice a gap.`,
      `<b>Big data is cut up.</b> Each segment must fit in one packet, about 1460 bytes of data. Our ${M.record.length}-byte record fits in one; a 1 MB photo would need around 700.`,
      `<b>Nothing is lost.</b> The server answers with ACKs. Anything not acknowledged in time is sent again.`] : [
      `<b>Ports pick the program.</b> Same as TCP: destination <code>443</code>, source <code>${NET.sport}</code>.`,
      `<b>That is all.</b> UDP adds a length and a checksum. No handshake, no sequence numbers, no ACKs, no resending.`,
      `It is fast and simple, and losses stay lost unless the program above deals with them.`],
    focus:'l4',
    extra: M => M.proto === 'tcp' ? `<h3>Opened earlier: the three-way handshake</h3><ol class="hs"><li>laptop <code>SYN</code> "let's talk; my bytes start at a random number"</li><li>server <code>SYN-ACK</code> "agreed; here is my starting number"</li><li>laptop <code>ACK</code> "got it". Only now can TLS, then our request, go.</li></ol>` : '',
    note:'Browsers that use UDP for the web (HTTP/3) run QUIC on top of it, which puts ordering and resending back in, inside the browser.',
    who:'The operating system kernel: the TCP code in Linux, Windows and macOS. Programs reach it through "sockets".',
    tryit: {
      html: () => `<div class="seg"><button class="btn" id="tcp" aria-pressed="${msg.proto === 'tcp'}">TCP</button><button class="btn" id="udp" aria-pressed="${msg.proto === 'udp'}">UDP</button></div><p>Switch protocols and compare the headers: 20 bytes of bookkeeping, or 8.</p>`,
      bind: () => { for (const p of ['tcp', 'udp']) document.getElementById(p).onclick = () => { if (msg.proto === p) return; msg.proto = p; sel = 'l4'; refresh(); stamp(); }; },
    },
    arrive: () => stamp(),
  },
};
const HS = [['laptop', 'ClientHello', '"I speak TLS 1.3. Here is my half of a key exchange."'], ['server', 'ServerHello', '"Agreed. Here is my half." Both now compute the same secret keys.'],
            ['server', 'Certificate', `"I really am ${NET.host}," signed by an authority the laptop trusts.`], ['both', 'Finished', 'Each checks that nobody tampered with the conversation so far.']];

/* the message blocks at each stop (header first) */
function pduFor(st, M){
  if (st.kind !== 'send') return [];
  const n = st.layer, out = [];
  if (n <= 4) out.push({ key:'l4', label:M.l4.name, bytes:M.l4.len, layer:4 });
  if (n <= 6) out.push({ key:'tls', label:'TLS', bytes:5, layer:6 }, { key:'data', label:'ENCRYPTED', bytes:M.ct.length, layer:6, enc:true }, { key:'tag', label:'TAG', bytes:16, layer:6 });
  else out.push({ key:'data', label:'REQUEST', bytes:M.http.length, layer:7, cream:true });
  return out;
}
/* what each block holds, field by field */
function headerOf(key, M, st){
  if (key === 'data' && st.layer >= 7) return { view:'text', cap:`The whole request: ${M.http.length} bytes of plain text. Point at a field to find it in the bytes.`,
    parts:[['Method', 'GET'], [null, ' '], ['Path', M.path], [null, ' '], ['Version', 'HTTP/1.1'], [null, '\r\n'], ['Host header', 'Host: ' + NET.host], [null, '\r\n'], ['End of headers', '\r\n']],

function setParcel(list, src){

  const ws = list.map(blockW), gap = .1, tot = ws.reduce((a, b) => a + b, 0) + gap*Math.max(0, list.length - 1);
  const k = Math.min(1, 4.4/Math.max(tot, .01)); parcel.scale.setScalar(k);
  let x = -tot/2; const keep = new Set();
  list.forEach((b, i) => { const cx = x + ws[i]/2; x += ws[i] + gap; keep.add(b.key);
    let m = blocks.get(b.key);
    if (m && sig(m.userData) !== sig(b)){ const old = m; m = makeBlock(b); m.position.copy(old.position); parcel.remove(old); parcel.add(m); blocks.set(b.key, m); }
    if (!m){ m = makeBlock(b); blocks.set(b.key, m); parcel.add(m);
      const from = src ? parcel.worldToLocal(src.clone()) : new THREE.Vector3(cx, 2, 0);
      m.position.copy(from); m.scale.setScalar(.2);
      tween(.9, e => { m.position.set(from.x + (cx - from.x)*e, from.y + (0 - from.y)*e + Math.sin(Math.PI*e)*1.4, from.z*(1 - e)); m.scale.setScalar(.2 + .8*e); });
    } else { const x0 = m.position.x, y0 = m.position.y, z0 = m.position.z; tween(.6, e => m.position.set(x0 + (cx - x0)*e, y0*(1 - e), z0*(1 - e))); }
  });
  for (const [key, m] of blocks) if (!keep.has(key)){ blocks.delete(key); const s0 = m.scale.x; tween(.4, e => m.scale.setScalar(s0*(1 - e)), () => parcel.remove(m)); }
}

/* tiny animation helpers */
const anims = [];
const easeIO = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;
function tween(dur, fn, done){ anims.push({ t:0, dur, fn, done }); }
function wait(s, fn){ tween(s, () => {}, fn); }
function typeScreen(){ ANIM.typed = 0; tween(1.2, e => { ANIM.typed = e; drawScreen(); }, () => { ANIM.typed = 1; drawScreen(); }); }
function spinRotors(){ const r0 = ANIM.rotors.map(r => r.rotation.y); tween(1.4, e => ANIM.rotors.forEach((r, i) => r.rotation.y = r0[i] + e*(6 + i*3.3)));
  tween(.5, e => ANIM.shackle.position.y = ANIM.shackleY + .18*(1 - e)); }
function printTicket(){ tween(1, e => ANIM.ticket.position.z = -.3 + .55*e); playHandshake(); }
function playHandshake(){ let i = 0; const step = () => { ANIM.hsStep = i; drawHS(); document.querySelectorAll('#hs li').forEach((li, j) => li.classList.toggle('on', j === i));
    const d = ANIM.drawers[i % ANIM.drawers.length]; const z0 = d.position.z; tween(.5, e => d.position.z = z0 + Math.sin(Math.PI*e)*.3);
    if (++i <= HS.length - 1) wait(.75, step); else wait(.75, () => { ANIM.hsStep = -1; drawHS(); document.querySelectorAll('#hs li').forEach(li => li.classList.remove('on')); }); };
  step(); }
function stamp(){ drawSeq(); const y = ANIM.headY; tween(.7, e => ANIM.head.position.y = y - .42*Math.sin(Math.PI*Math.min(1, e*2)) - .42*Math.sin(Math.PI*Math.max(0, e*2 - 1))); }
drawScreen(); drawHS(); drawSeq();

/* camera: each stop has a shot; the camera eases between shots, and you can drag to look around */
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function shotFor(st){
  if (st.kind === 'intro') return { target:V(0, 6.5, 2), off:V(15, 19, 62) };
  const t = st.kind === 'recv' ? RECV : SEND, y = (st.layer - 1)*FH;
  if (st.kind === 'send' || st.kind === 'recv') return { target:V(t.x + .2, y + 1.0, 1.2), off:V(7.4, 1.6, 17) };
  return { target:V(0, 1, 6), off:V(6, 7, 18) };
}
const cam = { target:V(0, 6.5, 2), off:V(15, 19, 62), yaw:0, pitch:0, zoom:1 };
function moveCamera(st, instant){
  const s = shotFor(st), t0 = cam.target.clone(), o0 = cam.off.clone(), y0 = cam.yaw, p0 = cam.pitch, z0 = cam.zoom;
  if (instant){ cam.target.copy(s.target); cam.off.copy(s.off); cam.yaw = cam.pitch = 0; cam.zoom = 1; return; }
  tween(1.5, e => { e = easeIO(e); cam.target.lerpVectors(t0, s.target, e); cam.off.lerpVectors(o0, s.off, e); cam.yaw = y0*(1 - e); cam.pitch = p0*(1 - e); cam.zoom = z0 + (1 - z0)*e; });
}
function applyCamera(){
  const aspect = camera.aspect, fit = aspect < 1.25 ? Math.min(2.2, 1.25/aspect) : 1;
  const sph = new THREE.Spherical().setFromVector3(cam.off);
  sph.theta += cam.yaw; sph.phi = Math.max(.25, Math.min(1.5, sph.phi - cam.pitch)); sph.radius *= cam.zoom*fit;
  camera.position.copy(cam.target).add(new THREE.Vector3().setFromSpherical(sph)); camera.lookAt(cam.target);
}
{ const el = renderer.domElement; let drag = null;
  el.addEventListener('pointerdown', e => { drag = { x:e.clientX, y:e.clientY, yaw:cam.yaw, pitch:cam.pitch }; el.classList.add('drag'); el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', e => { if (!drag) return; cam.yaw = Math.max(-1.3, Math.min(1.3, drag.yaw - (e.clientX - drag.x)*.006)); cam.pitch = Math.max(-.5, Math.min(.6, drag.pitch + (e.clientY - drag.y)*.004)); });
  const up = () => { drag = null; el.classList.remove('drag'); }; el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  el.addEventListener('wheel', e => { e.preventDefault(); cam.zoom = Math.max(.45, Math.min(1.8, cam.zoom*Math.exp(e.deltaY*.001))); }, { passive:false });
  el.addEventListener('dblclick', () => { const y = cam.yaw, p = cam.pitch, z = cam.zoom; tween(.6, e => { e = easeIO(e); cam.yaw = y*(1 - e); cam.pitch = p*(1 - e); cam.zoom = z + (1 - z)*e; }); }); }

/* ================= ENGINE: navigation, panel, route map ================= */
let cur = 0, sel = null;
const built = i => !!CONTENT[ROUTE[i].id];
function go(i, instant = false){
  i = Math.max(0, Math.min(ROUTE.length - 1, i));
  if (!built(i)) return toast(`${ROUTE[i].short}: coming in the next build`);
  const prev = cur; cur = i; sel = null; const st = ROUTE[i];
  if (location.hash.slice(1) !== st.id) history.replaceState(null, '', '#' + st.id);
  moveCamera(st, instant);
  const wide = st.kind === 'intro', lbls = [SEND.label, RECV.label, ...NETLABELS], o0 = lbls[0].material.opacity, o1 = wide ? 1 : 0;
  if (instant) lbls.forEach(l => l.material.opacity = o1); else tween(.6, e => lbls.forEach(l => l.material.opacity = o0 + (o1 - o0)*e));
  const ly = (st.kind === 'send' ? st.layer - 1 : 6)*FH - .2, y0 = lift.position.y;
  if (instant) lift.position.y = ly; else tween(1.5, e => lift.position.y = y0 + (ly - y0)*easeIO(e));
  const srcs = { 7:ANIM.src7, 6:ANIM.src6, 4:ANIM.src4 };
  wait(instant ? 0 : (prev === i ? 0 : 1.1), () => { setParcel(pduFor(st, model(msg)), st.kind === 'send' && srcs[st.layer] ? srcs[st.layer]() : null); const c = CONTENT[st.id]; if (c.arrive) c.arrive(); });
  renderPanel(); renderRail();
  const ch = document.getElementById('chip'); ch.querySelector('i').style.background = colorOf(st);
  ch.querySelector('span').textContent = `${i}/${ROUTE.length - 1} · ${st.kind === 'intro' ? 'Overview' : kickerOf(st).split(' · ')[0] + ' · ' + st.short}`;
}
function refresh(){ // the message changed (path, protocol, peek): update the words, the block row and the screens
  const st = ROUTE[cur]; renderMsg(); setParcel(pduFor(st, model(msg)), null); drawScreen(); drawSeq();
  const c = CONTENT[st.id]; if (c.steps) document.getElementById('steps').innerHTML = c.steps(model(msg)).map(s => `<li>${s}</li>`).join('');
  if (c.extra) document.getElementById('extra').innerHTML = c.extra(model(msg));
  document.querySelectorAll('.try [aria-pressed]').forEach(b => b.setAttribute('aria-pressed', b.id === 'peek' ? msg.peek : b.id === msg.proto));
}
function renderPanel(){
  const st = ROUTE[cur], c = CONTENT[st.id], M = model(msg);
  let h = `<div class="kicker"><i style="background:${colorOf(st)}"></i>${kickerOf(st)}</div><h2>${c.title}</h2><p class="lead">${c.lead}</p>`;
  if (c.body) h += c.body(M);
  if (c.steps) h += `<h3>What happens here</h3><ol class="steps" id="steps">${c.steps(M).map(s => `<li>${s}</li>`).join('')}</ol>`;
  if (pduFor(st, M).length) h += `<div id="msg"></div>`;
  if (c.extra) h += `<div id="extra">${c.extra(M)}</div>`;
  if (c.note) h += `<aside class="note"><b>Worth knowing</b>${c.note}</aside>`;
  if (c.who) h += `<h3>Who does this</h3><p style="margin:0">${c.who}</p>`;
  if (c.tryit) h += `<section class="try"><h3>Try it</h3>${c.tryit.html(M)}</section>`;
  const body = document.getElementById('panelBody'); body.innerHTML = h; body.parentElement.scrollTop = 0;
  if (c.tryit && c.tryit.bind) c.tryit.bind();
  renderMsg();
  const nx = ROUTE[cur + 1], pv = ROUTE[cur - 1], nxOk = nx && built(cur + 1);
  document.getElementById('nav').innerHTML = `<button class="btn" id="prev" ${pv ? '' : 'disabled'}>Back</button>`
    + `<button class="btn next" id="next" ${nxOk ? '' : 'disabled'}>${nx ? (nxOk ? `Next: ${nx.short} &rarr;` : `Next: ${nx.short} (coming soon)`) : 'The end'}</button>`;
  document.getElementById('prev').onclick = () => go(cur - 1); document.getElementById('next').onclick = () => go(cur + 1);
}
function renderMsg(){
  const box_ = document.getElementById('msg'); if (!box_) return;
  const st = ROUTE[cur], c = CONTENT[st.id], M = model(msg), list = pduFor(st, M), total = list.reduce((a, b) => a + b.bytes, 0);
  if (!sel || !list.some(b => b.key === sel)) sel = c.focus || list[0].key;
  const H = headerOf(sel, M, st), tint = {}; H.fields.forEach(([f], i) => tint[f] = TINTS[i % TINTS.length]);
  let bytes = '';
  for (const [f, v] of H.parts){
    if (H.view === 'text'){ const t = esc(v).replace(/\r\n/g, '<em>\\r\\n</em>\n'); bytes += f ? `<span data-f="${f}" style="--t:${tint[f]}">${t}</span>` : `<span class="sep">${t}</span>`; }
    else { const show = v.slice(0, 16).map(hex).join(' '); bytes += `<span data-f="${f}" style="--t:${tint[f]}">${show}</span>${v.length > 16 ? `<span class="more"> … +${v.length - 16} bytes</span>` : ''} `; }
  }
  box_.innerHTML = `<h3>The message now <span class="n">· ${total} bytes</span></h3>`
    + `<div class="pdu">${list.map(b => `<button class="blk${b.enc ? ' enc' : ''}${b.key === sel ? ' on' : ''}" data-k="${b.key}" style="--c:${b.cream ? '#fbf7ea' : LCOL[b.layer]};flex-grow:${blockW(b).toFixed(2)}"><b>${b.label}</b><small>${b.bytes} B</small></button>`).join('')}</div>`
    + (c.unchanged ? `<p class="cap"><b style="color:var(--ink)">${c.unchanged}</b></p>` : '')
    + `<p class="cap">${H.cap}</p><div class="bytes">${bytes.trim()}</div>`
    + (H.peek ? `<p class="cap">Decrypted, it says:</p><div class="bytes">${esc(H.peek).replace(/\r\n/g, '<em>\\r\\n</em>\n')}</div>` : '')
    + `<div class="flds">${H.fields.map(([f, v, d]) => `<div class="fld" data-f="${f}"><div class="fh"><i style="--t:${tint[f]}"></i><b>${f}</b><code>${esc(v)}</code></div><p>${d}</p></div>`).join('')}</div>`
    + `<p class="cap">Tap a block above to see its fields.</p>`;
  box_.querySelectorAll('.blk').forEach(b => b.onclick = () => { sel = b.dataset.k; renderMsg(); });
  const hl = (f, on) => box_.querySelectorAll(`[data-f="${CSS.escape(f)}"]`).forEach(x => x.classList.toggle('hl', on));
  box_.querySelectorAll('[data-f]').forEach(x => { x.onmouseenter = () => hl(x.dataset.f, true); x.onmouseleave = () => hl(x.dataset.f, false); });
}
function renderRail(){
  const el = document.getElementById('rail'), W = Math.max(320, el.clientWidth - 20), n = ROUTE.length, pad = 26, H = 84;
  const X = i => pad + i*(W - 2*pad)/(n - 1), Y = st => st.kind === 'intro' ? 10 : st.layer ? 12 + (7 - st.layer)*7 : 61;
  const pts = ROUTE.map((st, i) => [X(i), Y(st)]);
  let s = `<svg viewBox="0 0 ${W} ${H}" aria-label="Route map">`;
  const grp = [['LAPTOP', 1, 7], ['NETWORK', 8, 11], ['SERVER', 12, 18]];
  for (const [t, a, b] of grp) s += `<text x="${(X(a) + X(b))/2}" y="${H - 1}" text-anchor="middle" fill="#7a7263" letter-spacing="1.5">${t}</text>`;
  s += `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="#c9c1b0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>`;
  s += `<polyline points="${pts.slice(0, cur + 1).map(p => p.join(',')).join(' ')}" fill="none" stroke="#231e16" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>`;
  const sm = (W - 2*pad)/(n - 1) < 30;
  ROUTE.forEach((st, i) => { const [x, y] = pts[i], on = i === cur, ok = built(i), r = sm ? (on ? 7 : 5) : (on ? 10 : 7.5);
    const txt = st.kind === 'intro' ? '' : st.layer ? st.layer : st.kind === 'switch' ? 'S' : st.kind === 'router' ? 'R' : '';
    s += `<g class="dot${ok ? '' : ' off'}" data-i="${i}"><title>${esc(kickerOf(st))}: ${esc(st.short)}${ok ? '' : ' (coming soon)'}</title>`
      + `<circle cx="${x}" cy="${y}" r="${r + 6}" fill="transparent"/>`
      + `<circle cx="${x}" cy="${y}" r="${r}" fill="${ok ? colorOf(st) : '#f2efe7'}" stroke="#231e16" stroke-width="${on ? 2.6 : 1.6}" ${ok ? '' : 'stroke-dasharray="2.5 2.5"'}/>`
      + (on ? `<circle cx="${x}" cy="${y}" r="${r + (sm ? 3 : 4.5)}" fill="none" stroke="#231e16" stroke-width="1.5"/>` : '')
      + (txt !== '' && !sm ? `<text x="${x}" y="${y + 3.5}" text-anchor="middle" fill="${st.kind === 'intro' || !ok ? '#7a7263' : '#231e16'}">${txt}</text>` : '') + `</g>`; });
  el.innerHTML = s + '</svg>';
  el.querySelectorAll('.dot').forEach(d => d.onclick = () => go(+d.dataset.i));
}
let toastT = 0;
function toast(t){ const el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 1800); }
addEventListener('keydown', e => { if (/input|textarea/i.test(e.target.tagName)) return;
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)){ e.preventDefault(); go(cur + 1); }
  else if (['ArrowLeft', 'PageUp'].includes(e.key)){ e.preventDefault(); go(cur - 1); }
  else if (e.key === 'Home') go(0); });
addEventListener('hashchange', () => { const i = ROUTE.findIndex(s => s.id === location.hash.slice(1)); if (i >= 0 && i !== cur) go(i); });

/* resize + frame loop */
function resize(){ const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix(); renderRail(); }
new ResizeObserver(resize).observe(stage);
let last = performance.now();
function frame(now){ const dt = Math.min(.12, (now - last)/1000); last = now;
  for (let i = anims.length - 1; i >= 0; i--){ const a = anims[i]; a.t += dt; const k = Math.min(1, a.t/a.dur); a.fn(k); if (k >= 1){ anims.splice(i, 1); if (a.done) a.done(); } }
  applyCamera(); renderer.render(scene3, camera); requestAnimationFrame(frame); }
resize();
go(Math.max(0, ROUTE.findIndex(s => s.id === location.hash.slice(1))), true);
requestAnimationFrame(frame);
window.__journey = { go, get cur(){ return cur; }, msg, model };
</script>
</body></html>
