<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Network Journey</title>
<meta name="description" content="Follow one web request through the seven OSI layers, from a laptop to a server and back, with the real bytes at every step.">
<meta name="theme-color" content="#f2efe7">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='4' y='3.0' width='24' height='2.8' rx='1' fill='%23ef6a4c'/><rect x='4' y='6.6' width='24' height='2.8' rx='1' fill='%23f5a04a'/><rect x='4' y='10.2' width='24' height='2.8' rx='1' fill='%23f2c94c'/><rect x='4' y='13.8' width='24' height='2.8' rx='1' fill='%238fd0a6'/><rect x='4' y='17.4' width='24' height='2.8' rx='1' fill='%236cc3cf'/><rect x='4' y='21.0' width='24' height='2.8' rx='1' fill='%237c9fe2'/><rect x='4' y='24.6' width='24' height='2.8' rx='1' fill='%23b39ad8'/></svg>">
<style>
  :root{--paper:#f2efe7;--card:#fbf9f3;--ink:#231e16;--muted:#7a7263;--rule:#ddd6c8;
    --l7:#ef6a4c;--l6:#f5a04a;--l5:#f2c94c;--l4:#8fd0a6;--l3:#6cc3cf;--l2:#7c9fe2;--l1:#b39ad8;--wire:#9aa3ad}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  code,.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
  .app{display:grid;grid-template-columns:minmax(0,1fr) 410px;grid-template-rows:auto minmax(0,1fr) auto;height:100vh;height:100dvh}
  header{grid-column:1/3;display:flex;align-items:baseline;gap:14px;padding:12px 20px 4px}
  header h1{font:800 15px ui-monospace,Menlo,monospace;margin:0;letter-spacing:.03em}
  header span{color:var(--muted);font-size:13px}
  #stage{position:relative;min-height:0;overflow:hidden}
  #stage canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  #stage canvas.drag{cursor:grabbing}
  .chip{position:absolute;left:16px;top:10px;display:flex;align-items:center;gap:8px;font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;
    background:rgba(251,249,243,.9);border:1px solid var(--rule);border-radius:999px;padding:5px 12px;pointer-events:none}
  .chip i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink)}
  .toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-6px);opacity:0;transition:.2s;background:#fff1bf;border:1px solid rgba(35,30,22,.3);
    border-radius:8px;padding:6px 12px;font:600 13px ui-monospace,Menlo,monospace;pointer-events:none;box-shadow:0 6px 18px rgba(35,30,22,.14)}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  #panel{min-height:0;overflow:auto;border-left:1px solid var(--rule);background:var(--card);display:flex;flex-direction:column}
  #panelBody{padding:18px 24px 8px;flex:1}
  .kicker{display:flex;align-items:center;gap:8px;font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .kicker i{width:12px;height:12px;border-radius:3px;border:1.5px solid var(--ink)}
  h2{font-size:28px;line-height:1.15;margin:6px 0 8px;letter-spacing:-.01em}
  .lead{font-size:18px;line-height:1.45;margin:0 0 14px}
  h3{font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
  h3 .n{color:var(--ink)}
  .steps{margin:0;padding-left:22px}
  .steps li{margin:0 0 6px}
  .pdu{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 6px}
  .blk{all:unset;cursor:pointer;flex:1 1 0;min-width:62px;border:1.5px solid var(--ink);border-radius:7px;padding:5px 6px;background:var(--c);text-align:center;
    box-shadow:0 2px 0 var(--ink);transition:transform .1s}
  .blk b{display:block;font:800 11.5px ui-monospace,Menlo,monospace;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .blk small{display:block;font:600 11px ui-monospace,Menlo,monospace;opacity:.8}
  .blk.enc{background:repeating-linear-gradient(135deg,var(--c) 0 6px,color-mix(in srgb,var(--c) 70%,#fff) 6px 12px)}
  .blk.on{transform:translateY(-3px);box-shadow:0 5px 0 var(--ink)}
  .blk:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .cap{font-size:13.5px;color:var(--muted);margin:8px 0 6px}
  .bytes{font:13px/1.9 ui-monospace,Menlo,monospace;background:#fff;border:1px solid var(--rule);border-radius:8px;padding:8px 10px;word-break:break-all;white-space:pre-wrap}
  .bytes span{border-radius:4px;padding:1px 2px;background:var(--t);transition:box-shadow .1s}
  .bytes span.sep{background:none;color:var(--muted)}
  .bytes em{font-style:normal;color:var(--muted)}
  .bytes .more{background:none;color:var(--muted)}
  .bytes span.hl,.fld.hl{box-shadow:0 0 0 2px var(--ink)}
  .flds{margin-top:8px;display:flex;flex-direction:column;gap:4px}
  .fld{border-radius:8px;padding:6px 8px;background:#fff;border:1px solid var(--rule)}
  .fld .fh{display:flex;align-items:center;gap:8px}
  .fld .fh i{width:12px;height:12px;border-radius:3px;background:var(--t);border:1px solid rgba(35,30,22,.35);flex:none}
  .fld .fh b{font-size:13.5px}
  .fld .fh code{margin-left:auto;font-size:12.5px;background:#f2efe7;border-radius:5px;padding:0 6px;white-space:nowrap}
  .fld p{margin:2px 0 0 20px;font-size:13px;color:var(--muted);line-height:1.4}
  .note{margin:18px 0 0;padding:10px 12px;border-left:3px solid var(--ink);background:#f4f0e4;border-radius:0 8px 8px 0;font-size:14px}
  .note b{font:700 11px ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:2px}
  .try{margin-top:22px;padding:12px 14px 14px;border:1.5px dashed var(--ink);border-radius:12px}
  .try h3{margin-top:0}
  .try p{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
  .try input{font:15px ui-monospace,Menlo,monospace;padding:6px 10px;border:1.5px solid var(--ink);border-radius:8px;background:#fff;width:100%}
  .btn{font:600 13.5px ui-monospace,Menlo,monospace;color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
  .btn:hover{background:#ece6d6}
  .btn[aria-pressed=true]{background:var(--ink);color:var(--paper)}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .hs{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:4px}
  .hs li{padding:5px 8px;border-radius:8px;background:#fff;border:1px solid var(--rule);font-size:13.5px;transition:.15s}
  .hs li code{font-weight:700}
  .hs li.on{background:#fff1bf;border-color:var(--ink)}
  .layers{display:flex;flex-direction:column;gap:3px;margin:6px 0 0}
  .layers div{display:flex;gap:10px;align-items:baseline;font-size:14px}
  .layers i{flex:none;width:22px;height:18px;border-radius:4px;border:1.5px solid var(--ink);font:800 11px/15px ui-monospace,Menlo,monospace;text-align:center;font-style:normal;background:var(--c)}
  .layers b{min-width:98px}
  .layers span{color:var(--muted)}
  .cast{font-size:14px;margin:0;padding-left:18px}
  .hint{color:var(--muted);font-size:13.5px}
  .nav{position:sticky;bottom:0;display:flex;gap:8px;justify-content:space-between;padding:12px 24px 14px;background:linear-gradient(transparent,var(--card) 30%)}
  .nav .btn{padding:9px 16px}
  .nav .next{background:var(--ink);color:var(--paper);margin-left:auto}
  .nav .next:hover{background:#3a3228}
  .nav .btn:disabled{opacity:.4;cursor:default}
  #rail{grid-column:1/3;border-top:1px solid var(--rule);background:var(--paper);padding:2px 10px 4px}
  #rail svg{display:block;width:100%;height:84px;overflow:visible}
  #rail .dot{cursor:pointer}
  #rail .dot.off{cursor:default}
  #rail text{font:700 10px ui-monospace,Menlo,monospace;pointer-events:none}
  .blk.gone{opacity:.5;border-style:dashed;box-shadow:none}
  .blk.gone small::after{content:" off"}
  .wave{display:block;width:100%;height:auto;background:#fff;border:1px solid var(--rule);border-radius:8px}
  table.cmp{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
  table.cmp th,table.cmp td{padding:5px 7px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
  table.cmp th{font:700 11px ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:#f7f4ec}
  table.cmp td code{font-size:12px}
  table.cmp tr.on td{background:#fff1bf}
  table.cmp td.chg{background:#ffe2d6}
  .out{margin-top:8px;font-size:13.5px;background:#fff;border:1px solid var(--rule);border-radius:8px;padding:8px 10px}
  .try select{font:14px ui-monospace,Menlo,monospace;padding:7px 8px;border:1.5px solid var(--ink);border-radius:8px;background:#fff;width:100%}
  .leaves{font-size:13.5px;margin:6px 0 0}
  .analogy{margin:-2px 0 14px;font-size:14.5px;line-height:1.45;color:#4b4438;padding:2px 0 2px 11px;border-left:4px solid var(--c,#c9c1b0)}
  .analogy b{font:700 10.5px ui-monospace,Menlo,monospace;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:1px}
  .legend{display:flex;gap:3px;margin:6px 0 4px}
  .legend span{flex:1 1 auto;border:1.5px solid var(--ink);border-radius:6px;padding:3px 2px;text-align:center;font:800 10.5px ui-monospace,Menlo,monospace;background:var(--c)}
  .legend span.enc{background:repeating-linear-gradient(135deg,var(--c) 0 5px,color-mix(in srgb,var(--c) 70%,#fff) 5px 10px)}
  /* loader: covers the page at once; its contents fade in only if loading takes longer than a moment */
  #loader{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:var(--paper);transition:opacity .45s ease,visibility 0s .45s}
  body.ready #loader{opacity:0;visibility:hidden}
  .ld{display:flex;flex-direction:column;align-items:center;gap:16px;opacity:0;animation:ldIn .4s ease .2s forwards;padding:0 16px;text-align:center}
  .ld h1{font:800 14px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;margin:0}
  .ld-floors{display:flex;flex-direction:column;gap:5px;width:132px}
  .ld-floors i{height:12px;border:1.5px solid var(--ink);border-radius:4px;background:var(--c);transform-origin:left;transform:scaleX(.08);animation:ldFloor 2.1s ease-in-out infinite}
  .ld-floors i:nth-child(7){animation-delay:0s}.ld-floors i:nth-child(6){animation-delay:.12s}.ld-floors i:nth-child(5){animation-delay:.24s}
  .ld-floors i:nth-child(4){animation-delay:.36s}.ld-floors i:nth-child(3){animation-delay:.48s}.ld-floors i:nth-child(2){animation-delay:.6s}.ld-floors i:nth-child(1){animation-delay:.72s}
  .ld p{margin:0;color:var(--muted);font:600 13px ui-monospace,Menlo,Consolas,monospace;max-width:30em}
  @keyframes ldIn{to{opacity:1}}
  @keyframes ldFloor{0%,100%{transform:scaleX(.08)}40%,60%{transform:scaleX(1)}}
  @media (prefers-reduced-motion:reduce){.ld-floors i{animation:none;transform:none}}
  @media (max-width:860px){
    .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 45vh minmax(0,1fr) auto}
    header{grid-column:1} header span{display:none}
    #panel{border-left:0;border-top:1px solid var(--rule)}
    #rail{grid-column:1}
    #panelBody{padding:14px 16px 8px} .nav{padding:10px 16px 12px}
    h2{font-size:24px} .lead{font-size:16.5px}
  }
</style></head>
<body>
<div id="loader" role="status" aria-live="polite"><div class="ld">
  <h1>THE NETWORK JOURNEY</h1>
  <div class="ld-floors" aria-hidden="true"><i style="--c:#ef6a4c"></i><i style="--c:#f5a04a"></i><i style="--c:#f2c94c"></i><i style="--c:#8fd0a6"></i><i style="--c:#6cc3cf"></i><i style="--c:#7c9fe2"></i><i style="--c:#b39ad8"></i></div>
  <p id="ldText">Building the network…</p>
  <noscript><p>This page needs JavaScript.</p></noscript>
</div></div>
<div class="app">
  <header><h1>THE NETWORK JOURNEY</h1><span>one web request, seven layers, from a laptop to a server</span></header>
  <div id="stage"><div class="chip" id="chip"><i></i><span></span></div><div class="toast" id="toast"></div></div>
  <aside id="panel"><div id="panelBody"></div><nav class="nav" id="nav"></nav></aside>
  <div id="rail"></div>
</div>
<script src="vendor/three.min.js"></script>
<script>
/* The Network Journey.
   One request (GET / from a laptop at 10.0.0.20 to a web server at 10.0.1.7) is followed stop by stop:
   down the laptop's seven layers, across a cable, a switch, a router and another cable, and up the server's layers.
   The page is three parts: MESSAGE (the real bytes at every layer), ROUTE + CONTENT (one plain-data entry per stop),
   and the ENGINE (a three.js scene the camera flies through, a text panel, and a route map). */
addEventListener('error', e => { document.documentElement.dataset.errors = (document.documentElement.dataset.errors || '') + e.message + ';';
  if (!document.body.classList.contains('ready')){ const t = document.getElementById('ldText'); document.querySelectorAll('.ld-floors i').forEach(i => i.style.animation = 'none');
    if (t) t.textContent = /webgl/i.test(e.message || '') ? 'This page draws in 3D with WebGL, which this browser or device has turned off. Try another browser, or turn on hardware acceleration.' : 'Something went wrong while loading. Try reloading the page.'; } });

/* ================= MESSAGE: the real bytes ================= */
const NET = { laptop:'10.0.0.20', server:'10.0.1.7', gw:'10.0.0.1', gw2:'10.0.1.1', host:'wiki.lan', sport:49152, dport:443 };
const MAC = { laptop:'3c:22:fb:00:00:20', rtA:'00:1a:2b:00:00:01', rtB:'00:1a:2b:00:01:01', server:'52:54:00:00:01:07' };
const msg = { path:'/', proto:'tcp', peek:false, unplug:false };
const enc = s => [...new TextEncoder().encode(s)];
const hashStr = s => { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; };
const prng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) & 255; };
const u16 = v => [v >> 8 & 255, v & 255], u32 = v => [v >>> 24 & 255, v >>> 16 & 255, v >>> 8 & 255, v & 255];
const ip4 = s => s.split('.').map(Number), macB = s => s.split(':').map(h => parseInt(h, 16));
function inetSum(bytes){ let s = 0; for (let i = 0; i < bytes.length; i += 2) s += (bytes[i] << 8) + (bytes[i + 1] || 0); while (s >> 16) s = (s & 0xffff) + (s >> 16); return ~s & 0xffff; }
const CRC_T = Array.from({ length:256 }, (_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; return c >>> 0; });
const crc32 = b => { let c = 0xffffffff; for (const x of b) c = CRC_T[(c ^ x) & 255] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; };
function model(m){
  const req = `GET ${m.path} HTTP/1.1\r\nHost: ${NET.host}\r\n\r\n`, http = enc(req), rnd = prng(hashStr(m.path + 'k'));
  const ct = Array.from({ length: http.length + 1 }, rnd), tag = Array.from({ length: 16 }, rnd);   // TLS 1.3: request + 1 content-type byte, then a 16-byte AEAD tag
  const recLen = ct.length + tag.length, tlsHdr = [0x17, 3, 3, ...u16(recLen)], record = [...tlsHdr, ...ct, ...tag];
  const proto = m.proto === 'tcp' ? 6 : 17, pseudo = len => [...ip4(NET.laptop), ...ip4(NET.server), 0, proto, ...u16(len)];
  let l4;
  if (m.proto === 'tcp'){
    const seq = 0x4f2a9b11, ack = 0x1d7e33a3, h0 = [...u16(NET.sport), ...u16(NET.dport), ...u32(seq), ...u32(ack), 0x50, 0x18, ...u16(64240), 0, 0, 0, 0];
    const cs = inetSum([...pseudo(20 + record.length), ...h0, ...record]);
    l4 = { name:'TCP', len:20, seq, ack, cs, bytes:[...h0.slice(0, 16), ...u16(cs), 0, 0] };
  } else {
    const len = 8 + record.length, h0 = [...u16(NET.sport), ...u16(NET.dport), ...u16(len), 0, 0], cs = inetSum([...pseudo(len), ...h0, ...record]) || 0xffff;
    l4 = { name:'UDP', len:8, cs, ulen:len, bytes:[...h0.slice(0, 6), ...u16(cs)] };
  }
  const seg = [...l4.bytes, ...record];
  const ipHdr = ttl => { const h = [0x45, 0, ...u16(20 + seg.length), 0x1c, 0x46, 0x40, 0, ttl, proto, 0, 0, ...ip4(NET.laptop), ...ip4(NET.server)]; const cs = inetSum(h); h[10] = cs >> 8; h[11] = cs & 255; return h; };
  const hop = (dst, src, ttl) => { const ip = ipHdr(ttl), eth = [...macB(dst), ...macB(src), 8, 0], body = [...eth, ...ip, ...seg], crc = crc32(body);
    return { ttl, ip, eth, body, crc, fcs:[crc & 255, crc >>> 8 & 255, crc >>> 16 & 255, crc >>> 24], dst, src, len:body.length + 4 }; };
  return { req, http, ct, tag, recLen, tlsHdr, record, l4, seg, path:m.path, proto:m.proto, hop:{ A:hop(MAC.rtA, MAC.laptop, 64), B:hop(MAC.server, MAC.rtB, 63) } };
}
const hex = b => b.toString(16).padStart(2, '0'), hx = (v, n = 4) => v.toString(16).padStart(n, '0');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c]);

/* ================= ROUTE: every stop on the journey ================= */
const LAYER = { 7:'Application', 6:'Presentation', 5:'Session', 4:'Transport', 3:'Network', 2:'Data link', 1:'Physical' };
const LCOL = { 7:'#ef6a4c', 6:'#f5a04a', 5:'#f2c94c', 4:'#8fd0a6', 3:'#6cc3cf', 2:'#7c9fe2', 1:'#b39ad8', 0:'#9aa3ad' };
const ROUTE = [
  { id:'start', kind:'intro', short:'Start', layer:8 },
  ...[7, 6, 5, 4, 3, 2, 1].map(n => ({ id:'send-' + n, kind:'send', layer:n, short:LAYER[n] })),
  { id:'cable-1', kind:'wire', layer:0, short:'Cable' }, { id:'switch', kind:'switch', layer:0, short:'Switch' },
  { id:'router', kind:'router', layer:0, short:'Router' }, { id:'cable-2', kind:'wire', layer:0, short:'Cable' },
  ...[1, 2, 3, 4, 5, 6, 7].map(n => ({ id:'recv-' + n, kind:'recv', layer:n, short:LAYER[n] })),
  { id:'reply', kind:'reply', short:'The reply', layer:8 },
];
const colorOf = st => st.kind === 'intro' || st.kind === 'reply' ? '#231e16' : LCOL[st.layer] || LCOL[0];
const kickerOf = st => st.kind === 'intro' ? 'Start here' : st.kind === 'reply' ? 'The way back' : st.kind === 'send' ? `Laptop · Layer ${st.layer}` : st.kind === 'recv' ? `Server · Layer ${st.layer}` : 'On the network';
const hopOf = st => (st.kind === 'send' || st.id === 'cable-1' || st.kind === 'switch') ? 'A' : 'B';

/* small tables and pictures used by several stops */
const L3DST = [{ ip:NET.server, what:'the server' }, { ip:'10.0.0.33', what:'the office printer' }, { ip:'93.184.215.14', what:'a site on the internet' }];
const RTDST = [
  { ip:NET.server, what:'the server', row:1, out:'Matches <code>10.0.1.0/24</code>: out of eth1, straight to the server.' },
  { ip:'10.0.0.33', what:'the office printer', row:0, out:"Matches <code>10.0.0.0/24</code>: back out of eth0, onto the laptop's own network." },
  { ip:'93.184.215.14', what:'a site on the internet', row:2, out:'Only the default route <code>0.0.0.0/0</code> matches: out of eth2, to the internet provider at <code>203.0.113.1</code>. Without a default route the router would drop it and send back an ICMP "destination unreachable".' }];
const ROUTES = [['10.0.0.0/24', 'directly connected', 'eth0'], ['10.0.1.0/24', 'directly connected', 'eth1'], ['0.0.0.0/0', 'via 203.0.113.1', 'eth2']];
const MACT = [['1', MAC.laptop, 'laptop'], ['2', 'a8:5e:45:31:7c:02', 'printer'], ['3', 'f0:18:98:44:12:9e', 'desk PC'], ['4', MAC.rtA, 'router']];
let l3sel = 0, rtsel = 0, macForgot = false;
/* the same journey in everyday terms: posting a letter */
const ANALOGY = {
  'start':'It works much like the post. Going out, each step adds its own label; coming in, each step reads its label and takes it off.',
  'send-7':'Writing the letter.',
  'send-6':'Locking the letter in a box that only the recipient has a key for.',
  'send-5':'Keeping the thread of an ongoing correspondence, so you do not introduce yourself in every letter.',
  'send-4':'Numbering the pages, and adding the flat number so it reaches the right person in the building.',
  'send-3':'Writing the street address. It stays the same however many post offices handle the letter.',
  'send-2':'A label for the next leg only: "to the local sorting office". Every office along the way writes a new one.',
  'send-1':'The van that carries it. It moves the parcel without reading anything on it.',
  'cable-1':'The road.',
  'switch':'The mailroom of your own building. It knows which desk is where, and nothing beyond the building.',
  'router':'The sorting office. It reads the street address, throws away the old leg label and writes one for the next leg.',
  'cable-2':'The next road.',
  'recv-1':'The van arrives and unloads.',

}

/* where the message sits, where new blocks come from, where removed blocks go */
const holderFor = st => st.kind === 'send' ? SEND.lift : st.kind === 'recv' ? RECV.lift : st.kind === 'switch' ? SW.spot : st.kind === 'router' ? RT.spot : null;
function srcFor(st){ if (st.kind === 'send' || st.kind === 'recv'){ const A = ANIM[(st.kind === 'send' ? 's' : 'r') + st.layer]; return A && A.src ? A.src() : null; }
  if (st.kind === 'switch') return PORT(SW, 0); if (st.kind === 'router') return PORT(RT, 0); return null; }
const curveFor = st => ({ 'send-1':CURVE[1], 'cable-1':CURVE[1], 'switch':CURVE[2], 'router':CURVE[3], 'cable-2':CURVE[3], 'recv-1':CURVE[3] })[st.id] || null;
function arrive(st){ const M = model(msg), c = CONTENT[st.id], here = () => ROUTE[cur] === st;
  if (!here()) return;
  if (!holderFor(st) || st.kind === 'reply'){ if (c.arrive) c.arrive(); return; }
  if (st.kind === 'router'){ setParcel(frameB(M, 'A', false), PORT(RT, 0)); const top = W3(RT.g, 0, 1.4, 0); wait(1.3, () => { if (here()) setParcel(frameB(M, 'B', false), top(), top(), true); }); }
  else if (st.kind === 'recv'){ setParcel(pduFor(st, M).map(b => ({ ...b, gone:false })), st.layer === 1 ? W3(RECV.floors[1], -RW/2 - .3, Y0 + .3, -.2)() : srcFor(st)); wait(1.1, () => { if (here()) setParcel(leaveFor(st, M), srcFor(st), srcFor(st), true); }); }
  else setParcel(pduFor(st, M), srcFor(st), null, st.kind === 'send');
  if (c.arrive) c.arrive(); }

/* camera: each stop has a shot; the camera eases between shots, and you can drag to look around */
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function shotFor(st){
  if (st.kind === 'intro') return { target:V(0, 6.5, 2), off:V(15, 19, 62) };
  if (st.kind === 'reply') return { target:V(RX + .2, 7.4, 1), off:V(10, 4.5, 41) };
  if (st.kind === 'send' || st.kind === 'recv'){ const t = st.kind === 'recv' ? RECV : SEND; return { target:V(t.x + .2, (st.layer - 1)*FH + 1.0, 1.2), off:V(7.4, 1.6, 17) }; }
  if (st.kind === 'switch') return { target:V(SW.x, .9, 7.9), off:V(3.4, 3.4, 11) };
  if (st.kind === 'router') return { target:V(RT.x, 1.0, 7.9), off:V(3.4, 3.6, 11.5) };
  return st.id === 'cable-1' ? { target:V(-7.8, .6, 5), off:V(4, 5.5, 14) } : { target:V(8.6, .6, 5), off:V(-1, 5.5, 14.5) };
}
const cam = { target:V(0, 6.5, 2), off:V(15, 19, 62), yaw:0, pitch:0, zoom:1 };
function moveCamera(st, instant){ moveShot(shotFor(st), instant ? 0 : 1.5); }
let camTok = 0;
function moveShot(s, dur){
  const tk = ++camTok, instant = !dur, t0 = cam.target.clone(), o0 = cam.off.clone(), y0 = cam.yaw, p0 = cam.pitch, z0 = cam.zoom;
  if (instant){ cam.target.copy(s.target); cam.off.copy(s.off); cam.yaw = cam.pitch = 0; cam.zoom = 1; return; }
  tween(dur, e => { if (tk !== camTok) return; e = easeIO(e); cam.target.lerpVectors(t0, s.target, e); cam.off.lerpVectors(o0, s.off, e); cam.yaw = y0*(1 - e); cam.pitch = p0*(1 - e); cam.zoom = z0 + (1 - z0)*e; });
}
let replyTok = 0;
function playReply(){
  const tok = ++replyTok, ok = () => tok === replyTok && ROUTE[cur].id === 'reply', M = model(msg), steps = []; let t = 0;
  const at = (dt, fn) => { t += dt; steps.push([t, fn]); };
  const ride = (L, n) => { const y0 = L.position.y, y1 = liftY(n); tween(.55, e => L.position.y = y0 + (y1 - y0)*easeIO(e)); };
  const tower = x => ({ target:V(x + .2, 7.4, 1), off:V(10, 4.5, 41) });
  ANIM.s7.page = false; drawScreen(); pulseCurve = null;
  at(0, () => { moveShot(tower(RX), 1.4); relocate(RECV.lift, true); RECV.lift.position.y = liftY(7); serverLog(); });
  at(1.4, () => setParcel(respB(M, 7), ANIM.r7.src(), null, true));
  for (const n of [6, 5, 4, 3, 2, 1]) at(1.0, () => { ride(RECV.lift, n); wait(.5, () => { if (ok()) setParcel(respB(M, Math.max(n, 2)), ANIM['r' + n].src(), null, true); }); });
  at(1.2, () => { relocate(null); moveShot({ target:V(0, .6, 6), off:V(2, 9, 27) }, 1.3); pulseDir = -1; pulseCurve = CURVE[3]; });
  at(1.6, () => { pulseCurve = CURVE[2]; blinkPorts('rt', [0, 1]); });
  at(1.6, () => { pulseCurve = CURVE[1]; blinkPorts('sw', [0, 3]); });
  at(1.6, () => { pulseCurve = null; pulseDir = 1; moveShot(tower(SX), 1.4); relocate(SEND.lift, true); SEND.lift.position.y = liftY(1);
    setParcel(respB(M, 2, 'A'), W3(SEND.floors[1], RW/2 + .3, Y0 + .6, -.2)(), null, false); });
  for (const n of [2, 3, 4, 5, 6]) at(1.0, () => { ride(SEND.lift, n); wait(.5, () => { if (ok()) setParcel(respB(M, n + 1, 'A'), null, ANIM['s' + n].src(), true); }); });
  at(1.0, () => { ride(SEND.lift, 7); moveShot(shotFor(ROUTE[sendIdx(7)]), 1.4); wait(.6, () => { if (ok()) setParcel([], null, ANIM.s7.src(), true); }); });
  at(1.4, () => { ANIM.s7.page = true; drawScreen(); });
  for (const [tt, fn] of steps) wait(tt, () => { if (ok()) fn(); });
}
function applyCamera(){
  const aspect = camera.aspect, fit = aspect < 1.25 ? Math.min(2.2, 1.25/aspect) : 1;
  const sph = new THREE.Spherical().setFromVector3(cam.off);
  sph.theta += cam.yaw; sph.phi = Math.max(.25, Math.min(1.5, sph.phi - cam.pitch)); sph.radius *= cam.zoom*fit;
  camera.position.copy(cam.target).add(new THREE.Vector3().setFromSpherical(sph)); camera.lookAt(cam.target);
}
{ const el = renderer.domElement; let drag = null;
  el.addEventListener('pointerdown', e => { drag = { x:e.clientX, y:e.clientY, yaw:cam.yaw, pitch:cam.pitch }; el.classList.add('drag'); el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', e => { if (!drag) return; cam.yaw = Math.max(-1.3, Math.min(1.3, drag.yaw - (e.clientX - drag.x)*.006)); cam.pitch = Math.max(-.5, Math.min(.6, drag.pitch + (e.clientY - drag.y)*.004)); });
  const up = () => { drag = null; el.classList.remove('drag'); }; el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  el.addEventListener('wheel', e => { e.preventDefault(); cam.zoom = Math.max(.45, Math.min(1.8, cam.zoom*Math.exp(e.deltaY*.001))); }, { passive:false });
  el.addEventListener('dblclick', () => { const y = cam.yaw, p = cam.pitch, z = cam.zoom; tween(.6, e => { e = easeIO(e); cam.yaw = y*(1 - e); cam.pitch = p*(1 - e); cam.zoom = z + (1 - z)*e; }); }); }

/* ================= ENGINE: navigation, panel, route map ================= */
let cur = 0, sel = null;
const built = i => !!CONTENT[ROUTE[i].id];
const sendIdx = n => ROUTE.findIndex(s => s.id === 'send-' + n);
function go(i, instant = false){
  i = Math.max(0, Math.min(ROUTE.length - 1, i));
  if (!built(i)) return toast(`${ROUTE[i].short}: coming soon`);
  const prev = cur; cur = i; sel = null; const st = ROUTE[i];
  if (msg.unplug && st.id !== 'send-1'){ msg.unplug = false; setPlug(); if (!instant) toast('Cable plugged back in'); }
  if (location.hash.slice(1) !== st.id) history.replaceState(null, '', '#' + st.id);
  moveCamera(st, instant);
  const wide = st.kind === 'intro', lbls = [SEND.label, RECV.label, ...NETLABELS], o0 = lbls[0].material.opacity, o1 = wide ? 1 : 0;
  if (instant) lbls.forEach(l => l.material.opacity = o1); else tween(.6, e => lbls.forEach(l => l.material.opacity = o0 + (o1 - o0)*e));
  ROUTELINE.visible = st.kind === 'intro';
  if (st.kind !== 'reply'){ replyTok++; pulseDir = 1; if (ANIM.s7.page){ ANIM.s7.page = false; drawScreen(); } }
  const ls = liftY(st.kind === 'send' ? st.layer : i < sendIdx(7) ? 7 : 1), lr = liftY(st.kind === 'recv' ? st.layer : 1);
  if (st.kind !== 'reply') for (const [L, y1] of [[SEND.lift, ls], [RECV.lift, lr]]){ const y0 = L.position.y; if (instant) L.position.y = y1; else if (y0 !== y1) tween(1.5, e => L.position.y = y0 + (y1 - y0)*easeIO(e)); }
  pulseCurve = curveFor(st);
  if (st.kind !== 'reply') relocate(holderFor(st), instant);
  wait(instant || st.kind === 'reply' ? 0 : (prev === i ? 0 : 1.1), () => arrive(st));
  renderPanel(); renderRail();
  const ch = document.getElementById('chip'); ch.querySelector('i').style.background = colorOf(st);
  const pn = pduName(st, model(msg));
  ch.querySelector('span').textContent = `${i}/${ROUTE.length - 1} · ${st.kind === 'intro' ? 'Overview' : st.kind === 'reply' ? 'The reply' : (st.kind === 'send' ? 'Laptop' : st.kind === 'recv' ? 'Server' : 'Network') + ' · ' + st.short}${pn ? ' · ' + pn : ''}`;
}
function refresh(){ // the message changed (path, protocol, peek): update the words, the block row and the screens
  const st = ROUTE[cur], c = CONTENT[st.id], M = model(msg); renderMsg();
  if (holderFor(st)) setParcel(leaveFor(st, M), null);
  drawScreen(); drawSeq('s4'); drawSeq('r4'); crcScreen('s'); crcScreen('r');
  if (c.steps) document.getElementById('steps').innerHTML = c.steps(M).map(s => `<li>${s}</li>`).join('');
  if (c.extra) document.getElementById('extra').innerHTML = c.extra(M);
  document.querySelectorAll('.try [aria-pressed]').forEach(b => b.setAttribute('aria-pressed', b.id === 'peek' ? msg.peek : b.id === msg.proto));
}
function renderPanel(){
  const st = ROUTE[cur], c = CONTENT[st.id], M = model(msg);
  let h = `<div class="kicker"><i style="background:${colorOf(st)}"></i>${kickerOf(st)}</div><h2>${c.title}</h2><p class="lead">${c.lead}</p>`;
  if (ANALOGY[st.id]) h += `<p class="analogy" style="--c:${colorOf(st)}"><b>In everyday terms</b>${ANALOGY[st.id]}</p>`;
  if (c.body) h += c.body(M);
  if (c.steps) h += `<h3>What happens here</h3><ol class="steps" id="steps">${c.steps(M).map(s => `<li>${s}</li>`).join('')}</ol>`;
  if (pduFor(st, M).length) h += `<div id="msg"></div>`;
  if (c.extra) h += `<div id="extra">${c.extra(M)}</div>`;
  if (c.note) h += `<aside class="note"><b>Worth knowing</b>${c.note}</aside>`;
  if (c.who) h += `<h3>Who does this</h3><p style="margin:0">${c.who}</p>`;
  if (c.tryit) h += `<section class="try"><h3>Try it</h3>${c.tryit.html(M)}</section>`;
  const body = document.getElementById('panelBody'); body.innerHTML = h; body.parentElement.scrollTop = 0;
  if (c.tryit && c.tryit.bind) c.tryit.bind();
  renderMsg();
  const nx = ROUTE[cur + 1], pv = ROUTE[cur - 1];
  document.getElementById('nav').innerHTML = `<button class="btn" id="prev" ${pv ? '' : 'disabled'}>Back</button>`
    + (nx ? `<button class="btn next" id="next">Next: ${nx.short} &rarr;</button>` : `<button class="btn next" id="next">Start again</button>`);
  document.getElementById('prev').onclick = () => go(cur - 1); document.getElementById('next').onclick = () => go(nx ? cur + 1 : 0);
}
function renderMsg(){
  const box_ = document.getElementById('msg'); if (!box_) return;
  const st = ROUTE[cur], c = CONTENT[st.id], M = model(msg), list = pduFor(st, M), total = list.reduce((a, b) => a + b.bytes, 0);
  if (!sel || !list.some(b => b.key === sel)) sel = c.focus && list.some(b => b.key === c.focus) ? c.focus : list[0].key;
  const H = headerOf(sel, M, st), tint = {}; H.fields.forEach(([f], i) => tint[f] = TINTS[i % TINTS.length]);
  let bytes = '';
  for (const [f, v] of H.parts){
    if (H.view === 'text'){ const t = esc(v).replace(/\r\n/g, '<em>\\r\\n</em>\n'); bytes += f ? `<span data-f="${f}" style="--t:${tint[f]}">${t}</span>` : `<span class="sep">${t}</span>`; }
    else { const show = v.slice(0, 16).map(hex).join(' '); bytes += `<span data-f="${f}" style="--t:${tint[f]}">${show}</span>${v.length > 16 ? `<span class="more"> … +${v.length - 16} bytes</span>` : ''} `; }
  }
  const gone = list.filter(b => b.gone);
  box_.innerHTML = `<h3>${st.kind === 'recv' ? 'Arriving' : 'The message now'}: <span class="n">${pduName(st, M)}, ${total} bytes</span></h3>`
    + `<div class="pdu">${list.map(b => `<button class="blk${b.enc ? ' enc' : ''}${b.gone ? ' gone' : ''}${b.key === sel ? ' on' : ''}" data-k="${b.key}" style="--c:${b.cream ? '#fbf7ea' : LCOL[b.layer]};flex-grow:${blockW(b).toFixed(2)}"><b>${b.label}</b><small>${b.bytes} B</small></button>`).join('')}</div>`
    + (gone.length ? `<p class="leaves">Dashed: removed on this floor (${gone.map(b => b.label).join(' and ')}). It leaves with ${total - gone.reduce((a, b) => a + b.bytes, 0)} bytes.</p>` : '')
    + (c.leaves ? `<p class="leaves">${c.leaves(M)}</p>` : '')
    + (c.unchanged ? `<p class="cap"><b style="color:var(--ink)">${c.unchanged}</b></p>` : '')
    + `<p class="cap">${H.cap}</p><div class="bytes">${bytes.trim()}</div>`
    + (H.peek ? `<p class="cap">Decrypted, it says:</p><div class="bytes">${esc(H.peek).replace(/\r\n/g, '<em>\\r\\n</em>\n')}</div>` : '')
    + `<div class="flds">${H.fields.map(([f, v, d]) => `<div class="fld" data-f="${f}"><div class="fh"><i style="--t:${tint[f]}"></i><b>${f}</b><code>${esc(v)}</code></div><p>${d}</p></div>`).join('')}</div>`
    + (list.length > 1 ? `<p class="cap">Tap a block above to see its fields.</p>` : '');
  box_.querySelectorAll('.blk').forEach(b => b.onclick = () => { sel = b.dataset.k; renderMsg(); });
  const hl = (f, on) => box_.querySelectorAll(`[data-f="${CSS.escape(f)}"]`).forEach(x => x.classList.toggle('hl', on));
  box_.querySelectorAll('[data-f]').forEach(x => { x.onmouseenter = () => hl(x.dataset.f, true); x.onmouseleave = () => hl(x.dataset.f, false); });
}
function renderRail(){
  const el = document.getElementById('rail'), W = Math.max(320, el.clientWidth - 20), n = ROUTE.length, pad = 26, H = 84;
  const X = i => pad + i*(W - 2*pad)/(n - 1), Y = st => st.kind === 'intro' || st.kind === 'reply' ? 10 : st.layer ? 12 + (7 - st.layer)*7 : 61;
  const pts = ROUTE.map((st, i) => [X(i), Y(st)]), sm = (W - 2*pad)/(n - 1) < 30;
  let s = `<svg viewBox="0 0 ${W} ${H}" aria-label="Route map">`;
  for (const [t, a, b] of [['LAPTOP', 1, 7], ['NETWORK', 8, 11], ['SERVER', 12, 18], ['REPLY', 19, 19]]) s += `<text x="${(X(a) + X(b))/2}" y="${H - 1}" text-anchor="middle" fill="#7a7263" letter-spacing="1.5">${t}</text>`;
  s += `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="#c9c1b0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>`;
  s += `<polyline points="${pts.slice(0, cur + 1).map(p => p.join(',')).join(' ')}" fill="none" stroke="#231e16" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>`;
  ROUTE.forEach((st, i) => { const [x, y] = pts[i], on = i === cur, ok = built(i), r = sm ? (on ? 7 : 5) : (on ? 10 : 7.5);
    const txt = st.kind === 'intro' || st.kind === 'reply' ? '' : st.layer ? st.layer : st.kind === 'switch' ? 'S' : st.kind === 'router' ? 'R' : '';
    s += `<g class="dot${ok ? '' : ' off'}" data-i="${i}"><title>${esc(kickerOf(st))}: ${esc(st.short)}</title>`
      + `<circle cx="${x}" cy="${y}" r="${r + 6}" fill="transparent"/>`
      + `<circle cx="${x}" cy="${y}" r="${r}" fill="${ok ? colorOf(st) : '#f2efe7'}" stroke="#231e16" stroke-width="${on ? 2.6 : 1.6}" ${ok ? '' : 'stroke-dasharray="2.5 2.5"'}/>`
      + (on ? `<circle cx="${x}" cy="${y}" r="${r + (sm ? 3 : 4.5)}" fill="none" stroke="#231e16" stroke-width="1.5"/>` : '')
      + (txt !== '' && !sm ? `<text x="${x}" y="${y + 3.5}" text-anchor="middle" fill="#231e16">${txt}</text>` : '') + `</g>`; });
  el.innerHTML = s + '</svg>';
  el.querySelectorAll('.dot').forEach(d => d.onclick = () => go(+d.dataset.i));
}
let toastT = 0;
function toast(t){ const el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 1800); }
addEventListener('keydown', e => { if (/input|textarea|select/i.test(e.target.tagName)) return;
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)){ e.preventDefault(); go(cur + 1); }
  else if (['ArrowLeft', 'PageUp'].includes(e.key)){ e.preventDefault(); go(cur - 1); }
  else if (e.key === 'Home') go(0); });
addEventListener('hashchange', () => { const i = ROUTE.findIndex(s => s.id === location.hash.slice(1)); if (i >= 0 && i !== cur) go(i); });

/* resize + frame loop */
function resize(){ const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix(); renderRail(); }
new ResizeObserver(resize).observe(stage);
let last = performance.now();
let shown = false;
function frame(now){ const dt = Math.min(.12, (now - last)/1000); last = now;
  for (let i = anims.length - 1; i >= 0; i--){ const a = anims[i]; a.t += dt; const k = a.dur > 0 ? Math.min(1, a.t/a.dur) : 1; a.fn(k); if (k >= 1){ anims.splice(i, 1); if (a.done) a.done(); } }
  updatePulses(now/1000); updateLeds(now); applyCamera(); renderer.render(scene3, camera);
  if (!shown){ shown = true; document.body.classList.add('ready'); }
  requestAnimationFrame(frame); }
resize();
go(Math.max(0, ROUTE.findIndex(s => s.id === location.hash.slice(1))), true);
requestAnimationFrame(frame);
window.__journey = { go, get cur(){ return cur; }, msg, model };
</script>
