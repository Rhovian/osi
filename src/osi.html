<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OSI model</title></head><body>
<script src="core.js"></script>
<script>
/* OSI 7-layer model as a physical machine: two seven-storey towers on a desk board, joined by a real Ethernet cable
   through a switch and a router.

   How it really works (where the data is after each step):
   1. Sender L7 (application): the browser writes the request (GET /). The letter is put in the lift car at floor 7.
   2. L6 (presentation): TLS encrypts the letter (a TLS header is added, the body turns to ciphertext).
   3. L5 (session): a session tag is added so both ends know which conversation it belongs to.
   4. L4 (transport): wrapped in a segment with source/destination ports (TCP 20-byte header, or UDP 8-byte header).
   5. L3 (network): wrapped in a packet with source/destination IP addresses.
   6. L2 (data link): wrapped in a frame: MAC header in front, FCS (checksum) trailer behind.
   7. L1 (physical): the frame leaves the NIC as bits on the twisted pairs of the cable.
   8. Switch (L2 device): reads the destination MAC, looks it up in its MAC table, forwards out of the right port.
   9. Router (L3 device): strips the frame, reads the destination IP, looks up its routing table, builds a NEW frame
      with its own MAC as source and the next hop's MAC as destination. The IP packet is not changed.
  10. Receiver L1 -> L7: each floor checks and removes its own wrapping (FCS check, IP, port, session, TLS decrypt),
      and the letter reaches the receiver's browser.
  11. TCP only: the receiver's L4 sends an ACK back down the cable; the sender's L4 stops its retransmit timer.

   Parts (each part is held by another):
   BOARD      desk board . power strip . four power cords . Ethernet cables c1 (sender>switch), c2 (switch>router),
              c3 (router>receiver) . six RJ45 plugs (one per cable end)
   TOWER x2   seven floor storeys (each its own colour band) . roof cap . floor plates . IEC power inlet . back vents
              per-floor status lamp . per-floor hatch to the lift . floor 1 NIC with RJ45 jack and link LED
   LIFT x2    glass shaft (front + two side panes) . four corner posts . pit plate . two guide rails on the tower face .
              car platform . yoke (two posts + crossbar) . hoist cable . winch housing on top
   FLOOR 7    monitor (foot, neck, screen) . keyboard . conveyor belt to the hatch
   FLOOR 6    cipher wheel (outer ring, inner ring, spindle) . padlock (body, shackle) . conveyor
   FLOOR 5    handshake rail . two sliders that meet and lock . three handshake lamps . conveyor
   FLOOR 4    sequence counter with display . retransmit timer dial . ACK lamp . ACK cup . conveyor
   FLOOR 3    routing table card on its foot . IP stamp (pad, block, handle) . conveyor
   FLOOR 2    MAC table card . MAC controller board . MAC chip . FCS (CRC) chip . conveyor
   FLOOR 1    NIC board . PHY transceiver . magnetics . RJ45 jack . two twisted pairs . frame buffer chip
   RISER      ACK tube from the NIC up through floors 1-3 to the ACK cup on floor 4
   SWITCH     case . board . switch ASIC with heat-sink fins . MAC table chip . four port jacks . PSU . fan . port LEDs
   ROUTER     case . board . CPU with heat-sink fins . two RAM sticks . routing table flash . three port jacks . PSU .
              fan . status screen
*/

/* ---------- geometry (x = depth, front at high x; y = width, +y toward the viewer's left; z = up; 1 unit ~ 1 cm) ---------- */
const BH = 3, BXD = 66, BYW = 180, BRAD = 6;
const BTOP = boardTop(0, 0, BXD, BYW, BH, BRAD);
const TX0 = 8, TX1 = 38, FH = 10, TTOP = BH + 7*FH, CAPH = 4;      // towers: x 8..38, seven 10-high floors, roof cap
const SHX = 47, HOUS = 5;                                            // lift shaft in front of the tower, winch housing on top
const zF = n => BH + (n - 1)*FH;                                     // bottom of floor n
const TOWERS = {
  s: { key:'s', name:'SENDER',   y0:124, y1:172, out:172, dir:-1, sy0:124, sy1:146, port:168 },
  r: { key:'r', name:'RECEIVER', y0:8,   y1:56,  out:8,   dir: 1, sy0:34,  sy1:56,  port:12 },
};
const SW = { x0:24, x1:42, y0:92, y1:110, z1:BH + 7, ports:[107, 103, 99, 95] };
const RT = { x0:24, x1:42, y0:64, y1:82, z1:BH + 13, ports:[79, 73, 67] };
const STRIP = [1.5, 76, 5.5, 104, BH + 2.4];
const LAYERS = {
  7: { name:'APPLICATION',  c:'#ef6a4c', pdu:'DATA',     part:'BROWSER',           protos:'HTTP, DNS, SMTP',              dev:'browser, web server' },
  6: { name:'PRESENTATION', c:'#f5a04a', pdu:'DATA',     part:'CIPHER WHEEL',      protos:'TLS encryption, UTF-8, JPEG',  dev:'TLS library' },
  5: { name:'SESSION',      c:'#f2c94c', pdu:'DATA',     part:'SESSION HANDSHAKE', protos:'TLS sessions, RPC, sockets',   dev:'operating system' },
  4: { name:'TRANSPORT',    c:'#8fd0a6', pdu:'SEGMENT',  part:'SEQ COUNTER',       protos:'TCP, UDP, QUIC',               dev:'firewall, load balancer' },
  3: { name:'NETWORK',      c:'#6cc3cf', pdu:'PACKET',   part:'ROUTING TABLE',     protos:'IP, ICMP',                     dev:'router' },
  2: { name:'DATA LINK',    c:'#7c9fe2', pdu:'FRAME',    part:'MAC TABLE',         protos:'Ethernet, Wi-Fi, ARP',         dev:'switch, NIC' },
  1: { name:'PHYSICAL',     c:'#b39ad8', pdu:'BITS',     part:'PHY TRANSCEIVER',   protos:'copper, fibre, radio',         dev:'cable, hub, transceiver' },
};
const lmat = c => ({ l:c, m:mix(c, '#000000', .13), d:mix(c, '#231e16', .42) });
const LM = {}; for (let n = 1; n <= 7; n++) LM[n] = lmat(LAYERS[n].c);
const CREAM = { l:'#fbf7ea', m:'#e9e2cc', d:'#bdb39a' }, PCB = { l:'#4fa36a', m:'#2f8a4a', d:'#1d5f31' }, PLATE = { l:'#efece4', m:'#d9d4c8', d:'#b3ad9f' };
const BRASS = matOf('#d8b25a'), BEIGE = matOf('#e6dcc0'), CABLE = '#3e86d9', PLUGM = matOf('#cfe3f2'), BELT = matOf('#8a847a');
const MACS = { s:'aa:01', rt:'cc:07', r:'bb:02' };
const cl = x => Math.max(0, Math.min(1, x)), lerp = (a, b, t) => a + (b - a)*t;
const corners = (x0, y0, z0, x1, y1, z1) => { const o = []; for (const x of [x0, x1]) for (const y of [y0, y1]) for (const z of [z0, z1]) o.push([x, y, z]); return o; };
const boxOf = (pts, e = .05) => [[0,1,2].map(i => Math.min(...pts.map(p => p[i])) - e), [0,1,2].map(i => Math.max(...pts.map(p => p[i])) + e)];

/* ---------- text on any vertical face (reads correctly on that face, hidden when the face turns away) ---------- */
const txN = (p, n, str, size, col = INK, wt = 800) => { const U = cross(n, [0,0,1]);
  return `<text transform="${txM(P(...p), Dv(...U), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${wt}" letter-spacing=".04em">${str}</text>`; };
// text lying on a top face, turned to whichever edge reads left-to-right from here
const txTop = (p, str, size, col = INK, wt = 800, dv = 0) => { const dirs = [[0,-1,0],[1,0,0],[0,1,0],[-1,0,0]];
  const U = dirs.reduce((a, b) => Dv(...b)[0] > Dv(...a)[0] ? b : a), V = cross([0,0,1], U); p = p.map((c, i) => c + V[i]*dv);
  return `<text transform="${txM(P(...p), Dv(...U), Dv(...V))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${wt}" letter-spacing=".06em">${str}</text>`; };
const circ = (p, r, c, extra = '') => { const [X, Y] = P(...p); return `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(r)}" fill="${c}" ${extra}/>`; };
const strk = (pts, c, w) => `<path d="${pd(pts, false)}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
// a red stamp with an X (a notice glyph facing the viewer)
const xStamp = (p, r = 3.2) => { const [X, Y] = P(...p), a = r*.5;
  return `<g><circle cx="${f(X)}" cy="${f(Y)}" r="${f(r)}" fill="#e2483d" stroke="${INK}" stroke-width="1.2"/>`
    + `<path d="M${f(X - a)} ${f(Y - a)}L${f(X + a)} ${f(Y + a)}M${f(X + a)} ${f(Y - a)}L${f(X - a)} ${f(Y + a)}" stroke="#fff4d6" stroke-width="1.6" stroke-linecap="round"/></g>`; };

/* ---------- cables ---------- */
function smooth3(pts, it = 3){
  for (let k = 0; k < it; k++){ const o = [pts[0]];
    for (let i = 0; i < pts.length - 1; i++){ const a = pts[i], b = pts[i + 1]; o.push(a.map((v, j) => v*.75 + b[j]*.25), a.map((v, j) => v*.25 + b[j]*.75)); }
    o.push(pts[pts.length - 1]); pts = o; }
  return pts;
}
function cord(pts, r, col){
  const d = pd(pts, false), cap = 'fill="none" stroke-linecap="round" stroke-linejoin="round"';
  return `<path d="${d}" ${cap} stroke="${INK}" style="stroke-width:${f(2*r + 1.6*INK_K)}"/><path d="${d}" ${cap} stroke="${col}" style="stroke-width:${f(2*r)}"/>`;
}
const CZ = BH + .9, PZp = 5.6;                                   // cable centre on the board, plug height
const SPLUG = [[TX1 + 3.6, 168, PZp], [TX1 + 5.6, 168, CZ]];
const SLOOSE = [[47, 172.4, BH + 1.1], [49.5, 171.5, CZ]];
const CAB_REST = {
  1: [[52, 167, CZ], [56, 162, CZ], [56, 113, CZ], [53, 107, CZ], [47.6, 107, CZ], [45.6, 107, PZp]],
  2: [[45.6, 95, PZp], [47.6, 95, CZ], [50, 92, CZ], [50, 82, CZ], [47.6, 79, CZ], [45.6, 79, PZp]],
  3: [[45.6, 67, PZp], [47.6, 67, CZ], [53, 64, CZ], [56, 58, CZ], [56, 17, CZ], [52, 12, CZ], [TX1 + 5.6, 12, CZ], [TX1 + 3.6, 12, PZp]],
};
const cabPath = (c, plugged) => smooth3(c === 1 ? [...(plugged ? SPLUG : SLOOSE), ...CAB_REST[1]] : CAB_REST[c]);
const pathLen = pts => { const L0 = [0]; for (let i = 1; i < pts.length; i++) L0.push(L0[i - 1] + Math.hypot(...sub(pts[i], pts[i - 1]))); return L0; };
const pathAt = (pts, cum, s) => { s = Math.max(0, Math.min(cum[cum.length - 1], s)); let i = 1; while (i < cum.length - 1 && cum[i] < s) i++;
  const t = (s - cum[i - 1]) / ((cum[i] - cum[i - 1]) || 1); return pts[i - 1].map((v, j) => v + (pts[i][j] - v)*t); };
const POWER = [
  [[TX0, 132, 6.5], [6.6, 132, CZ], [4.6, 124, CZ], [3.6, 116, CZ], [3.5, 108, CZ], [3.5, 104.2, BH + 1.2]],
  [[TX0, 48, 6.5], [6.6, 48, CZ], [4.6, 56, CZ], [3.6, 64, CZ], [3.5, 72, CZ], [3.5, 75.8, BH + 1.2]],
  [[SW.x0, 101, 5.5], [22.4, 101, CZ], [12, 99, CZ], [7.5, 98, CZ], [5.7, 98, BH + 1.2]],
  [[RT.x0, 73, 6], [22.4, 73, CZ], [12, 79, CZ], [7.5, 82, CZ], [5.7, 82, BH + 1.2]],
].map(p => smooth3(p));
const STRIP_OFF = smooth3([[STRIP[0], 90, BH + 1.2], [.4, 90, CZ], [-1.2, 90, 2], [-1.6, 90, -9]]);

/* ---------- the PDU: header blocks in a row, each in its layer's colour (MAC IP L4 SES TLS DATA FCS) ---------- */
const SEGS = [{ k:'mac', ly:2, len:2.8 }, { k:'ip', ly:3, len:2.6 }, { k:'l4', ly:4, len:2.6 }, { k:'ses', ly:5, len:1.4 },
              { k:'tls', ly:6, len:1.4 }, { k:'data', ly:7, len:4 }, { k:'fcs', ly:2, len:1.4 }];
function pduParts(lv, g, xa, xb, yc, z0, st, opac = 1){
  if (lv > 7) return [];
  const segs = SEGS.filter(sg => sg.ly >= lv).map(sg => ({ ...sg, len: (sg.k === 'l4' && st.proto === 'udp' ? 1.6 : sg.len) * (sg.ly === lv ? Math.max(.04, g) : 1) }));
  const gap = .18, tot = segs.reduce((a, sg) => a + sg.len, 0) + gap*(segs.length - 1), h = 4.4, enc = lv <= 6;
  let y = yc + tot/2; const out = [];
  for (const sg of segs){
    const y1 = y, y0 = y - sg.len; y = y0 - gap;
    if (sg.len < .1) continue;
    const M = sg.k === 'data' ? CREAM : sg.k === 'fcs' ? lmat(mix(LAYERS[2].c, '#1c2948', .25)) : LM[sg.ly];
    let svg = box(xa, y0, z0, xb, y1, z0 + h, M, toneI, .7);
    if (facing([0,0,1])){ const zt = z0 + h + .02;
      if (sg.k === 'data' && !enc) svg += line([[xa + 1.2, y1 - .5, zt], [xa + 1.2, y0 + .5, zt]], .4) + line([[xa + 2.6, y1 - .5, zt], [xa + 2.6, y0 + .5, zt]], .4) + line([[xa + 4, y1 - .5, zt], [xa + 4, y0 + 1.6, zt]], .4);
      if (sg.k === 'data' && enc){ let d = ''; for (let q = -6; q < 8; q += 1.3){ const a = Math.max(0, q), b = Math.min(xb - xa, q + sg.len);
          if (b > a + .1) d += pd([[xa + a, y1 - (a - q), zt], [xa + b, y1 - (b - q), zt]], false); }
        svg += `<path d="${d}" fill="none" stroke="${LAYERS[6].c}" stroke-width=".7"/>`; }
      if (sg.k === 'l4' || sg.k === 'ip' || sg.k === 'mac') svg += line([[xa + .8, (y0 + y1)/2, zt], [xb - .8, (y0 + y1)/2, zt]], .35);
    }
    out.push({ box:[[xa, y0, z0], [xb, y1, z0 + h]], svg: opac < 1 ? `<g opacity="${f(opac)}">${svg}</g>` : svg });
  }
  return out;
}

/* ---------- timeline: the run is a list of stages; the view is rebuilt from them every frame ---------- */
const DUR = { down:.95, wire:1.15, sw:.7, rt:1.1, up:.95, back:.85, fail:1.6, timeout:1.8, ack:.8 };
function plan(st, attempt = 0){
  const SQ = [], tcp = st.proto === 'tcp';
  for (let n = 7; n >= 1; n--) SQ.push({ k:'down', n });
  if (!st.plugged){ SQ.push({ k:'fail', what:'nolink', at:'s1' }); return SQ; }
  SQ.push({ k:'wire', c:1 }, { k:'sw' }, { k:'wire', c:2 });
  if (st.wrongIP){ SQ.push({ k:'rt', mode:'noroute' }, { k:'back', c:2, kind:'icmp' }, { k:'back', c:1, kind:'icmp' }, { k:'fail', what:'icmp', at:'s3' }); return SQ; }
  if (st.drop && attempt === 0){ SQ.push({ k:'rt', mode:'drop' }); if (!tcp) return SQ; SQ.push({ k:'timeout' }); return SQ.concat(plan(st, 1)); }
  SQ.push({ k:'rt', mode:'ok' }, { k:'wire', c:3, bad: st.corrupt && attempt === 0 }, { k:'up', n:1 });
  if (st.corrupt && attempt === 0){ SQ.push({ k:'up', n:2, fail:'fcs' }); if (!tcp) return SQ; SQ.push({ k:'timeout' }); return SQ.concat(plan(st, 1)); }
  for (let n = 2; n <= 7; n++){ if (n === 6 && st.badCert){ SQ.push({ k:'up', n:6, fail:'cert' }); return SQ; } SQ.push({ k:'up', n }); }
  if (tcp) SQ.push({ k:'back', c:3, kind:'ack' }, { k:'back', c:2, kind:'ack' }, { k:'back', c:1, kind:'ack' }, { k:'ack' });
  return SQ;
}
const freshView = () => ({ sF:7, sLv:8, sG:1, sFade:0, rF:7, rLv:8, rG:1, rFade:0, delivered:false, acked:false, fail:null,
  rtMsg:null, hop:'A', dstIP:'10.0.1.7', seq:1000 });
function clearTransient(v){ v.bits = null; v.back = null; v.act = new Set(); v.timer = 0; v.ackRise = 0; v.focus = null; v.k = null; v.u = 0; v.swOn = 0; }
function apply(v, sg, u){
  const a2 = ease(cl(u*2)), h2 = cl((u - .5)*2);
  v.k = sg.k; v.u = u;
  switch (sg.k){
    case 'down': {
      if (sg.n === 7){ v.fail = null; v.acked = false; v.delivered = false; v.rtMsg = null; v.hop = 'A';
        if (v.rLv <= 7){ v.rFade = u; if (u >= 1){ v.rLv = 8; v.rFade = 0; } } }
      v.sF = lerp(v.sF, sg.n, a2); v.rF = lerp(v.rF, sg.n, a2);
      if (sg.n === 1){ v.sLv = 2; v.sG = 1; v.sFade = h2; if (u >= 1){ v.sLv = 8; v.sFade = 0; } }
      else if (u >= .5){ v.sLv = sg.n; v.sG = ease(h2); }
      v.act.add('s' + sg.n); v.focus = ['s', sg.n]; break; }
    case 'wire': v.bits = { c:sg.c, u, bad: !!sg.bad && u > .35 }; v.act.add('c' + sg.c); v.sF = lerp(v.sF, 1 + 2*sg.c, ease(u)); v.focus = ['w', sg.c]; break;
    case 'sw': v.act.add('sw'); v.swOn = u; v.focus = ['sw']; break;
    case 'rt': v.act.add('rt'); v.focus = ['rt'];
      if (sg.mode === 'ok'){ v.rtMsg = u < .5 ? ['IN  ' + MACS.s + '>' + MACS.rt, 'IP > ' + v.dstIP] : ['OUT ' + MACS.rt + '>' + MACS.r, 'IP > ' + v.dstIP]; if (u >= .5) v.hop = 'B'; }
      else if (sg.mode === 'noroute'){ v.rtMsg = ['NO ROUTE TO', v.dstIP]; if (u > .4) v.fail = { what:'noroute', at:'rt' }; }
      else { v.rtMsg = ['QUEUE FULL', 'SEGMENT DROPPED']; if (u > .4) v.fail = { what:'drop', at:'rt' }; }
      break;
    case 'up': {
      const n = sg.n; v.rF = lerp(v.rF, n, a2); v.act.add('r' + n); v.focus = ['r', n];
      if (n === 1){ v.rLv = 2; v.rG = 1; v.rFade = 1 - ease(cl(u*1.4)); if (u >= 1) v.rFade = 0; }
      else if (sg.fail){ v.rLv = n;
        if (u >= .5){ v.fail = { what:sg.fail, at:'r' + n }; if (sg.fail === 'fcs'){ v.rFade = h2; if (u >= 1){ v.rLv = 8; v.rFade = 0; } } } }
      else if (u >= .5){ v.rLv = n;
        if (n < 7){ v.rG = 1 - ease(h2); if (u >= 1){ v.rLv = n + 1; v.rG = 1; } } else { v.rG = 1; v.delivered = true; } }
      break; }
    case 'back': v.back = { c:sg.c, u:1 - u, kind:sg.kind }; v.act.add('c' + sg.c); v.focus = ['w', sg.c]; break;
    case 'ack': v.act.add('s4'); v.ackRise = u; v.focus = ['s', 4]; if (u >= 1){ v.acked = true; v.ackRise = 0; } break;
    case 'timeout': v.act.add('s4'); v.timer = u; v.focus = ['s', 4]; if (u >= 1) v.timer = 0; break;
    case 'fail': v.fail = { what:sg.what, at:sg.at }; v.act.add(sg.at); v.focus = /^[sr]\d$/.test(sg.at) ? [sg.at[0], +sg.at[1]] : null; break;
  }
}
function view(st){
  const v = Object.assign(freshView(), st.rest || {}); clearTransient(v);
  v.dstIP = st.wrongIP ? '10.9.9.9' : '10.0.1.7';
  const r = st.run; if (!r) return v;
  v.dstIP = r.dstIP; v.seq = r.seq; v.proto = r.proto;
  for (let j = 0; j < r.i; j++){ apply(v, r.S[j], 1); clearTransient(v); }
  apply(v, r.S[r.i], r.u);
  return v;
}

/* ---------- the towers ---------- */
const yOf = t => d => t.out + t.dir*d;                                    // distance d in from the tower's outer side
const lampY = t => t.dir < 0 ? t.sy1 + 2.4 : t.sy0 - 2.4;
const labY = (t, n) => { const a = n === 1 ? t.port - t.dir*(-3.4) : t.out, b = lampY(t) - t.dir*1.6; return (a + b)/2; };
const tipOf = (n, st) => { const ly = LAYERS[n], pdu = n === 4 ? (st.proto === 'udp' ? 'datagram (UDP)' : 'segment (TCP)') : ly.pdu.toLowerCase();
  return `Layer ${n}: ${ly.name[0] + ly.name.slice(1).toLowerCase()} | PDU: ${pdu} | Protocols: ${ly.protos} | Real devices: ${ly.dev}`; };
function towerCase(t, st, v, m){
  const FR = facing([1,0,0]), BK = facing([-1,0,0]), yd = yOf(t), blink = Math.floor((st.clock || 0)*6) % 2 === 0;
  let s = '';
  for (let n = 1; n <= 7; n++){
    const M = LM[n], z0 = zF(n), z1 = z0 + FH, key = t.key + n, act = v.act.has(key);
    let g = box(TX0, t.y0, z0, TX1, t.y1, z1, M, tone, 1.1);
    if (FR){
      const X = TX1 + .05, hy0 = t.sy0 + 3, hy1 = t.sy1 - 3;
      g += shape(on(PX(X), rrUV(hy0, z0 + 1.6, hy1, z0 + 7.6, 1.2)), mix(M.d, '#f2efe7', .12), 1);           // hatch to the lift
      if (act) g += ink(pd(on(PX(X + .02), rrUV(hy0 - .4, z0 + 1.2, hy1 + .4, z0 + 8, 1.4))), 1.2).replace(INK, '#ffe066');
      const bad = v.fail && v.fail.at === key, amber = n === 4 && t.key === 's' && v.timer > 0;
      const lc = bad ? '#e2483d' : amber ? (blink ? '#f4b829' : '#8d877a') : act ? '#43c25c' : (n === 4 && t.key === 's' && v.acked) ? '#43c25c' : '#8d877a';
      g += shape(on(PX(X + .02), ellUV(lampY(t), z0 + 5, 1.05, 1.05, 14)), lc, .7);
      g += tx(X + .03, labY(t, n), z0 + 4.2, `${n} ${LAYERS[n].name}`, 2.2, INK, 800);
      if (n === 1){ const py = t.port, link = t.key === 's' ? st.plugged : true;
        g += shape(on(PX(X + .02), rrUV(py - 1.9, 3.9, py + 1.9, 7.7, .5)), '#bfc6c8', .8);
        g += shape(on(PX(X + .04), rectUV(py - 1.5, 4.2, py + 1.5, 7.2)), '#26231f', .5);

const busyNote = st => { if (st.run) ui.flash('Set for the next Send', 1400); };
const FAULTS = [['Unplug cable', 'plugged', true], ['Corrupt bits', 'corrupt'], ['Wrong IP', 'wrongIP'], ['Drop a segment', 'drop'], ['Use UDP', 'proto'], ['Bad certificate', 'badCert']];
function syncButtons(){ const st = ui.st;
  for (const b of document.querySelectorAll('#btns .act')){ const lab = b.textContent.trim(), fz = FAULTS.find(x => x[0] === lab);
    if (!fz) continue; const on3 = fz[1] === 'proto' ? st.proto === 'udp' : fz[2] ? !st[fz[1]] : !!st[fz[1]]; b.setAttribute('aria-pressed', on3); } }

ui = mountFigure({
  fig:'07', turn:'full', title:'OSI model: seven floors, one cable', credit: true,
  size:[BXD, BYW, TTOP + HOUS], palette:'cobalt',
  state:{ plugged:true, corrupt:false, wrongIP:false, drop:false, proto:'tcp', badCert:false, run:null, rest:null, seqNext:1000, clock:0 },
  scene,
  stats: st => { const v = st.__v || view(st), fc = v.focus;
    let pdu = '-';
    if (fc){ if (fc[0] === 'w') pdu = v.back ? (v.back.kind === 'ack' ? 'ACK' : 'ICMP') : 'BITS';
      else if (fc[0] === 'sw') pdu = 'FRAME'; else if (fc[0] === 'rt') pdu = 'PACKET';
      else { const lv = fc[0] === 's' ? v.sLv : v.rLv; pdu = lv > 7 ? (v.k === 'down' ? '-' : 'BITS') : lv === 4 && (v.proto || st.proto) === 'udp' ? 'DATAGRAM' : LAYERS[Math.max(1, lv)].pdu; } }
    else if (v.delivered) pdu = 'DATA';
    const macOn = fc && ((fc[0] === 's' && v.sLv <= 2) || (fc[0] === 'r' && v.rLv <= 2) || fc[0] === 'w' || fc[0] === 'sw' || fc[0] === 'rt');
    return [{ label:'PDU', value:pdu }, { label:'SRC MAC', value: macOn ? (v.back ? (v.back.c === 3 && v.back.kind === 'ack' ? MACS.r : MACS.rt) : v.hop === 'B' ? MACS.rt : MACS.s) : '-', small:true }, { label:'DST IP', value: v.dstIP, small:true }]; },
  buttons:[
    { label:'Send', onClick: st => send(st) },
    { label:'Step', onClick: st => stepOnce(st) },
    { label:'Unplug cable', onClick: st => { st.plugged = !st.plugged; if (st.run) ui.flash(st.plugged ? 'Plugged back in: set for the next Send' : 'Unplugged: set for the next Send', 1600); } },
    { label:'Corrupt bits', onClick: st => { st.corrupt = !st.corrupt; busyNote(st); } },
    { label:'Wrong IP', onClick: st => { st.wrongIP = !st.wrongIP; busyNote(st); } },
    { label:'Drop a segment', onClick: st => { st.drop = !st.drop; busyNote(st); } },
    { label:'Use UDP', onClick: st => { st.proto = st.proto === 'tcp' ? 'udp' : 'tcp'; busyNote(st); } },
    { label:'Bad certificate', onClick: st => { st.badCert = !st.badCert; busyNote(st); } },
  ],
  params:(st, q) => {
    if (q.get('unplug') === '1') st.plugged = false;
    if (q.get('corrupt') === '1') st.corrupt = true;
    if (q.get('wrongip') === '1') st.wrongIP = true;
    if (q.get('drop') === '1') st.drop = true;

    if (q.get('badcert') === '1') st.badCert = true;
    if (q.has('stage')){ st.run = { S: plan(st), i:0, u:0, mode:'step', paused:true, seq:1000, proto:st.proto, dstIP: st.wrongIP ? '10.9.9.9' : '10.0.1.7' };
      st.run.i = Math.max(0, Math.min(st.run.S.length - 1, +q.get('stage') | 0)); st.run.u = q.has('u') ? +q.get('u') : 1; st.clock = 0; }
  },
});
xrMount(() => ui, () => '');
{ const r1 = ui.render; ui.render = () => { r1(); syncButtons(); }; ui.render(); }
</script></body></html>
